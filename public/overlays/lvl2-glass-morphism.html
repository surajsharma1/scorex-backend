<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreX - Lvl 2 Hyper-Gloss Glass</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; overflow: hidden; color: #fff; font-family: 'Outfit', sans-serif; text-transform: uppercase; }

    @keyframes fadeUp { 0% { transform: translateY(30px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes glassShine {
      0% { transform: translateX(-150%) skewX(-30deg); }
      20%, 100% { transform: translateX(250%) skewX(-30deg); }
    }

    /* Hyper-Glossy Glass Material */
    .glass {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.02) 100%);
      backdrop-filter: blur(25px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-top: 1px solid rgba(255, 255, 255, 0.6);
      border-left: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4), inset 0 2px 15px rgba(255,255,255,0.2);
      position: relative; overflow: hidden;
    }
    /* The moving gloss reflection */
    .glass::before {
      content: ''; position: absolute; top: 0; left: 0; width: 60%; height: 100%;
      background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.3), transparent);
      animation: glassShine 5s infinite; pointer-events: none; z-index: 1;
    }

    #glass-island {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      padding: 8px 35px; border-radius: 30px; font-size: 14px; font-weight: 800; letter-spacing: 2px;
      color: #e0f2fe; animation: fadeUp 0.8s ease-out forwards; z-index: 10;
      text-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    #toss-overlay {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(25px) saturate(120%);
      display: none; align-items: center; justify-content: center; z-index: 50;
      font-size: 40px; font-weight: 900; color: #fff; text-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    /* Expanding Container */
    #expand-wrapper {
      position: absolute; bottom: 30px; left: 0; width: 100%; height: 85px;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
      z-index: 5; animation: fadeUp 1s ease-out forwards;
    }

    /* Event Reveal Panel */
    #reveal-panel {
      width: 75%; height: 0; background: linear-gradient(135deg, rgba(56, 189, 248, 0.8), rgba(2, 132, 199, 0.8));
      backdrop-filter: blur(15px); border-radius: 20px 20px 0 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 45px; font-weight: 900; color: #fff; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.4); border-bottom: none;
      box-shadow: inset 0 2px 10px rgba(255,255,255,0.5);
      transition: height 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); margin-bottom: -15px; z-index: 1;
    }
    #reveal-panel.show { height: 75px; padding-bottom: 15px; }

    /* Main Scoreboard Row */
    .board-row { display: flex; width: 100%; height: 85px; gap: 15px; padding: 0 30px; z-index: 2; }
    .g-panel { border-radius: 20px; display: flex; align-items: center; padding: 0 30px; }
    
    .p-score { min-width: 320px; justify-content: space-between; border-left: 5px solid #38bdf8; }
    .p-bat { flex: 1; max-width: 500px; justify-content: space-around; }
    .p-bowl { min-width: 340px; justify-content: space-between; border-right: 5px solid #38bdf8; }

    /* Crisp text to pop against glass */
    .txt-layer { position: relative; z-index: 2; display: flex; align-items: baseline; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    .tm { font-size: 16px; font-weight: 800; color: #bae6fd; letter-spacing: 1px; margin-bottom: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);}
    .sc { font-size: 46px; font-weight: 900; line-height: 1; }
    .sc span { font-size: 24px; color: #e2e8f0; }
    .ov { font-size: 15px; font-weight: 800; color: #0284c7; background: #e0f2fe; padding: 3px 10px; border-radius: 8px; margin-left: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.3);}

    .pn { font-size: 20px; font-weight: 800; color: #fff; }
    .ps { font-size: 38px; font-weight: 900; color: #38bdf8; margin-left: 10px; line-height: 1;}
    .pb { font-size: 14px; color: #cbd5e1; font-weight: 600; margin-left: 5px;}
    .lbl { font-size: 12px; color: #bae6fd; font-weight: 800; margin-bottom: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.8);}
    .v-line { width: 1px; height: 40px; background: rgba(255,255,255,0.4); z-index: 2;}
  </style>
</head>
<body>

  <div id="glass-island" class="glass">SCOREX-LIVE.COM</div>
  <div id="toss-overlay"></div>

  <div id="expand-wrapper">
    <div id="reveal-panel">DECISION PENDING</div>
    <div class="board-row">
      <div class="g-panel glass p-score">
        <div style="display:flex; flex-direction:column; z-index: 2;">
          <div id="teamName" class="tm">TEAM</div>
          <div class="txt-layer">
            <div class="sc"><span id="teamScore">0</span><span>/</span><span id="teamWickets">0</span></div>
            <div class="ov">OV <span id="teamOvers">0.0</span></div>
          </div>
        </div>
      </div>
      
      <div class="g-panel glass p-bat">
        <div class="txt-layer">
          <span style="color:#38bdf8; margin-right:8px; font-size: 14px;">●</span>
          <span id="strikerName" class="pn">Striker</span><span id="strikerRuns" class="ps">0</span> <span class="pb">(<span id="strikerBalls">0</span>)</span>
        </div>
        <div class="v-line"></div>
        <div class="txt-layer" style="opacity: 0.7;">
          <span id="nonStrikerName" class="pn">Non-Striker</span><span id="nonStrikerRuns" class="ps" style="color:#fff;">0</span>
        </div>
      </div>

      <div class="g-panel glass p-bowl">
        <div style="display:flex; flex-direction:column; z-index: 2;">
          <span class="lbl">BOWLER</span>
          <div class="txt-layer">
            <span class="ps" style="color:#fff; margin-left:0;"><span id="bowlerWickets">0</span>-<span id="bowlerRuns">0</span></span> <span class="pb" style="margin-left:10px;">OV <span id="bowlerOvers">0.0</span></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let pSc = -1, pWk = -1, iSt = 0, cDat = {}, revTimeout;
    const $ = id => document.getElementById(id);

    setInterval(() => {
      if(!cDat.tournamentName) return;
      iSt = (iSt + 1) % 3;
      if(iSt === 0) $('glass-island').innerText = cDat.tournamentName;
      else if(iSt === 1) $('glass-island').innerText = "SCOREX-LIVE.COM";
      else $('glass-island').innerText = "CRR: " + (cDat.runRate||'0.0');
    }, 4500);

    function triggerReveal(txt, bg, isPersistent) {
      const rev = $('reveal-panel');
      if(revTimeout) clearTimeout(revTimeout);
      
      rev.innerText = txt; 
      rev.style.background = bg;
      rev.classList.add('show');
      
      if(!isPersistent) { revTimeout = setTimeout(() => { rev.classList.remove('show'); }, 3500); }
    }

    function processData(d) {
      cDat = d;
      if (d.team1Score == 0 && d.team1Overs === "0.0" && d.strikerRuns == 0 && d.tossWinner) {
        $('toss-overlay').style.display = 'flex'; $('toss-overlay').innerText = `${d.tossWinner} WON THE TOSS & ELECTED TO ${d.tossDecision}`;
      } else { $('toss-overlay').style.display = 'none'; }

      $('teamName').innerText = d.team1Name; $('teamScore').innerText = d.team1Score; $('teamWickets').innerText = d.team1Wickets; $('teamOvers').innerText = d.team1Overs;
      $('strikerName').innerText = d.strikerName; $('strikerRuns').innerText = d.strikerRuns; $('strikerBalls').innerText = d.strikerBalls;
      $('nonStrikerName').innerText = d.nonStrikerName; $('nonStrikerRuns').innerText = d.nonStrikerRuns;
      $('bowlerName').innerText = d.bowlerName; $('bowlerRuns').innerText = d.bowlerRuns; $('bowlerWickets').innerText = d.bowlerWickets; $('bowlerOvers').innerText = d.bowlerOvers;

      if (d.decisionPending) { triggerReveal("DECISION PENDING", "linear-gradient(135deg, rgba(245, 158, 11, 0.8), rgba(217, 119, 6, 0.8))", true); return; } 
      else if ($('reveal-panel').classList.contains('show') && $('reveal-panel').innerText === "DECISION PENDING") { $('reveal-panel').classList.remove('show'); }

      let ns = parseInt(d.team1Score)||0, nw = parseInt(d.team1Wickets)||0;
      if (pSc !== -1 && !d.decisionPending) {
        if (nw > pWk) triggerReveal("WICKET", "linear-gradient(135deg, rgba(239, 68, 68, 0.8), rgba(185, 28, 28, 0.8))"); 
        else if (ns - pSc === 6) triggerReveal("SIX RUNS", "linear-gradient(135deg, rgba(56, 189, 248, 0.8), rgba(2, 132, 199, 0.8))");
        else if (ns - pSc === 4) triggerReveal("BOUNDARY", "linear-gradient(135deg, rgba(255, 255, 255, 0.8), rgba(200, 200, 200, 0.8))");
      }
      pSc = ns; pWk = nw;
    }
    window.addEventListener('message', e => { if(e.data?.type === 'UPDATE_SCORE') processData(e.data.data); });
  </script>
</body>
</html>
