<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreX - Lvl 2 RGB Split</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Share+Tech+Mono&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; overflow: hidden; color: #fff; font-family: 'Teko', sans-serif; text-transform: uppercase; }

    /* The core glitch animation */
    @keyframes glitch-anim {
      0% { clip-path: inset(10% 0 85% 0); transform: translate(-2px, 2px); }
      10% { clip-path: inset(40% 0 43% 0); transform: translate(2px, -2px); }
      20% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, 0); }
      30% { clip-path: inset(15% 0 80% 0); transform: translate(2px, 2px); }
      40% { clip-path: inset(50% 0 30% 0); transform: translate(-2px, -2px); }
      50% { clip-path: inset(5% 0 60% 0); transform: translate(2px, 0); }
      100% { clip-path: inset(10% 0 85% 0); transform: translate(-2px, 2px); }
    }

    .glitch-wrapper { position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 1400px; height: 110px; }
    
    /* Base layers for the RGB Split */
    .glitch-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: stretch; background: rgba(10,10,10,0.9);
      border: 2px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    
    /* The Red offset */
    .glitch-red { background: rgba(255, 0, 60, 0.2); border-color: #ff003c; left: -4px; top: -2px; animation: glitch-anim 2.5s infinite linear alternate-reverse; z-index: 1; opacity: 0.8; mix-blend-mode: screen; pointer-events: none;}
    /* The Cyan offset */
    .glitch-cyan { background: rgba(0, 255, 255, 0.2); border-color: #00ffff; left: 4px; top: 2px; animation: glitch-anim 3s infinite linear alternate; z-index: 2; opacity: 0.8; mix-blend-mode: screen; pointer-events: none;}
    /* The Main solid layer */
    .glitch-main { z-index: 3; border-top: 4px solid #fff; border-bottom: 4px solid #fff; }

    /* Interior layout */
    .g-block { display: flex; align-items: center; padding: 0 30px; border-right: 1px dashed rgba(255,255,255,0.2); }
    .g-block:last-child { border-right: none; }

    .g-bat { flex: 1; justify-content: space-around; }
    .g-score { min-width: 380px; justify-content: space-between; background: repeating-linear-gradient(45deg, #111, #111 5px, #1a1a1a 5px, #1a1a1a 10px); }
    .g-bowl { min-width: 320px; justify-content: space-between; }

    /* Typography */
    .tm-lbl { font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: 2px;}
    .sc-lbl { font-size: 75px; font-weight: 700; line-height: 0.8; }
    .sc-lbl span { font-size: 40px; color: #888; }
    .ov-lbl { font-family: 'Share Tech Mono', monospace; font-size: 16px; background: #fff; color: #000; padding: 2px 10px; margin-left: 15px; font-weight: 700;}

    .grp { display: flex; flex-direction: column; }
    .hdr { font-family: 'Share Tech Mono', monospace; font-size: 13px; color: #aaa; letter-spacing: 2px; margin-bottom: 2px;}
    
    .p-row { display: flex; align-items: baseline; gap: 15px; }
    .p-n { font-size: 30px; font-weight: 700; color: #fff; }
    .p-s { font-size: 45px; font-weight: 700; color: #fff; line-height: 0.9;}
    .p-b { font-family: 'Share Tech Mono', monospace; font-size: 15px; color: #aaa; }

    .striker { color: #fff; }
    .striker .p-s { color: #00ffff; text-shadow: 2px 2px 0 #ff003c; }

    .g-bowl .p-s { color: #ff003c; text-shadow: 2px 2px 0 #00ffff;}

    /* Top Ticker */
    #rgb-top {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: #000; border: 1px solid #fff; padding: 5px 30px;
      font-family: 'Share Tech Mono', monospace; font-size: 15px; letter-spacing: 4px;
      text-shadow: -2px 0 #ff003c, 2px 0 #00ffff;
    }

    #rgb-event {
      position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
      font-size: 150px; line-height: 1; font-weight: 700;
      color: #fff; text-shadow: -6px 0 #ff003c, 6px 0 #00ffff;
      opacity: 0; transition: opacity 0.1s;
    }
    #rgb-event.show { opacity: 1; animation: glitch-anim 0.2s infinite; }

  </style>
</head>
<body>

  <div id="rgb-top"><span id="tournamentName">SYS.ERR // NO SIGNAL</span></div>
  <div id="rgb-event">WICKET</div>

  <div class="glitch-wrapper">
    <div class="glitch-layer glitch-red"></div>
    <div class="glitch-layer glitch-cyan"></div>
    
    <div class="glitch-layer glitch-main">
      
      <div class="g-block g-bat">
        <div class="grp striker">
          <span class="hdr" style="color:#00ffff;">> STRIKER_NODE</span>
          <div class="p-row">
            <span id="strikerName" class="p-n">Striker</span>
            <div><span id="strikerRuns" class="p-s">0</span> <span class="p-b">(<span id="strikerBalls">0</span>)</span></div>
          </div>
        </div>
        <div class="grp" style="opacity: 0.6;">
          <span class="hdr">> STANDBY_NODE</span>
          <div class="p-row">
            <span id="nonStrikerName" class="p-n">Non-Striker</span>
            <div><span id="nonStrikerRuns" class="p-s" style="font-size:35px; color:#fff; text-shadow:none;">0</span> <span class="p-b">(<span id="nonStrikerBalls">0</span>)</span></div>
          </div>
        </div>
      </div>

      <div class="g-block g-score">
        <div class="grp">
          <span class="hdr">> BASE_ENTITY</span>
          <div id="teamName" class="tm-lbl">TEAM</div>
        </div>
        <div style="display:flex; align-items:baseline;">
          <div class="sc-lbl"><span id="teamScore">0</span><span>/</span><span id="teamWickets">0</span></div>
          <div class="ov-lbl">OV <span id="teamOvers">0.0</span></div>
        </div>
      </div>

      <div class="g-block g-bowl">
        <div class="grp">
          <span class="hdr" style="color:#ff003c;">> HOSTILE_NODE</span>
          <span id="bowlerName" class="p-n">Bowler</span>
        </div>
        <div style="text-align: right;">
          <div class="p-s"><span id="bowlerWickets">0</span>-<span id="bowlerRuns">0</span></div>
          <div class="p-b" style="color:#fff;">OVERS <span id="bowlerOvers">0.0</span></div>
        </div>
      </div>

    </div>
  </div>

  <div style="position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,0.4); font-family: sans-serif; letter-spacing: 2px; z-index: 10000; pointer-events: none;">
    https://scorex-live.vercel.app/
  </div>

  <script>
    let pSc = -1, pWk = -1, rDat = {};
    const inject = (id, val) => { const e = document.getElementById(id); if(e && val != null) e.innerText = val; };

    function fireGlitch(txt) {
      const e = document.getElementById('rgb-event');
      e.innerText = txt; 
      e.classList.remove('show'); void e.offsetWidth; e.classList.add('show');
      setTimeout(() => e.classList.remove('show'), 1200); // Sharp fast glitch
    }

    setInterval(() => {
      const isl = document.getElementById('tournamentName');
      if(!rDat.tournamentName) return;
      let st = Math.floor(Date.now() / 4000) % 3;
      if(st === 0) isl.innerText = "LINK: " + rDat.tournamentName;
      else if(st === 1) isl.innerText = "VELOCITY // " + (rDat.runRate||'0.0');
      else isl.innerText = rDat.target > 0 ? "TARGET_ACQUIRE: " + rDat.target : "TRANSMISSION LIVE";
    }, 4000);

    function rx(d) {
      rDat = d;
      inject('teamName', d.team1Name); inject('teamScore', d.team1Score); inject('teamWickets', d.team1Wickets); inject('teamOvers', d.team1Overs);
      inject('strikerName', d.strikerName); inject('strikerRuns', d.strikerRuns); inject('strikerBalls', d.strikerBalls);
      inject('nonStrikerName', d.nonStrikerName); inject('nonStrikerRuns', d.nonStrikerRuns); inject('nonStrikerBalls', d.nonStrikerBalls);
      inject('bowlerName', d.bowlerName); inject('bowlerRuns', d.bowlerRuns); inject('bowlerWickets', d.bowlerWickets); inject('bowlerOvers', d.bowlerOvers);

      let ns = parseInt(d.team1Score)||0, nw = parseInt(d.team1Wickets)||0;
      if (pSc !== -1) {
        if (nw > pWk) fireGlitch("FATAL_WICKET");
        else if (ns - pSc === 6) fireGlitch("OVERLOAD: 6");
        else if (ns - pSc === 4) fireGlitch("SURGE: 4");
      }
      pSc = ns; pWk = nw;
    }

    window.addEventListener('message', e => { if(e.data?.type === 'UPDATE_SCORE') rx(e.data.data); });
    if ('BroadcastChannel' in window) new BroadcastChannel('scorex_overlay_channel').onmessage = e => { if(e.data?.type === 'UPDATE_SCORE') rx(e.data.data); };
  </script>
</body>
</html>
