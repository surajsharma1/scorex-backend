<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreX - Lvl 2 Asymmetric Blade</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Roboto:wght@700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; text-transform: uppercase; }
    body { background: transparent; overflow: hidden; color: #fff; }

    @keyframes slideInRight { 0% { transform: translateX(100%); } 100% { transform: translateX(0); } }

    /* Top Island */
    #blade-island {
      position: absolute; top: 30px; right: 40px;
      background: #111; border-right: 4px solid #eab308;
      padding: 6px 25px; font-weight: 900; letter-spacing: 2px; color: #fff;
      box-shadow: -5px 5px 15px rgba(0,0,0,0.5); animation: slideInRight 0.8s ease-out forwards; z-index: 10;
    }

    #toss-overlay {
      position: absolute; inset: 0; background: rgba(17, 17, 17, 0.95);
      display: none; align-items: center; justify-content: center; z-index: 50;
      font-family: 'Teko', sans-serif; font-size: 55px; color: #eab308;
    }

    /* Asymmetrical Bottom-Right Anchor */
    #blade-wrapper {
      position: absolute; bottom: 0; right: 0;
      display: flex; flex-direction: row-reverse; align-items: flex-end;
      z-index: 5; animation: slideInRight 1s ease-out forwards;
    }

    /* Primary Score Block (Right Anchor) */
    .bl-score {
      background: #eab308; color: #111;
      width: 350px; height: 100px;
      padding: 10px 30px; display: flex; flex-direction: column; justify-content: center;
      position: relative; z-index: 3; box-shadow: -10px 0 20px rgba(0,0,0,0.5);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 20px 100%);
    }

    /* Bowler Block (Right Stacked) */
    .bl-bowl {
      background: #111; color: #fff;
      width: 350px; height: 100px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 30px 0 50px; 
      position: relative; z-index: 2; margin-right: -20px;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 20px 100%);
    }

    /* Batsman Blade (Stretches Left) */
    .bl-bat {
      background: #27272a; color: #fff;
      width: 550px; height: 70px;
      display: flex; justify-content: space-around; align-items: center;
      padding: 0 40px 0 60px;
      position: relative; z-index: 1; margin-right: -20px;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 30px 100%);
      overflow: hidden;
    }

    /* Event Chevron Wipe (Originates right, wipes left) */
    #event-wipe {
      position: absolute; top: 0; right: 0; width: 100%; height: 100%;
      background: #fff; display: flex; align-items: center; justify-content: center;
      font-family: 'Teko', sans-serif; font-size: 55px; font-weight: 700; color: #111; letter-spacing: 2px;
      transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); z-index: 10;
    }
    .bl-bat.show #event-wipe { transform: translateX(0); }

    /* Typography */
    .tm { font-size: 20px; font-weight: 900; color: #111; line-height: 1; margin-bottom: 2px;}
    .sc { font-family: 'Teko', sans-serif; font-size: 65px; font-weight: 700; line-height: 0.8; }
    .sc span { font-size: 35px; color: #713f12; }
    .ov { font-size: 16px; font-weight: 900; color: #eab308; background: #111; padding: 4px 12px; margin-left: 20px; transform: skewX(-10deg); display: inline-block;}

    .pn { font-size: 20px; font-weight: 900; }
    .ps { font-family: 'Teko', sans-serif; font-size: 45px; font-weight: 700; color: #eab308; margin-left: 12px; line-height: 0.8;}
    .pb { font-size: 15px; color: #a1a1aa; font-weight: 700;}
    .lbl { font-size: 12px; font-weight: 900; margin-bottom: 2px; color: #a1a1aa;}
    .v-line { width: 3px; height: 35px; background: #3f3f46; transform: skewX(-15deg); }
  </style>
</head>
<body>

  <div id="blade-island">SCOREX-LIVE.COM</div>
  <div id="toss-overlay"></div>

  <div id="blade-wrapper">
    <div class="bl-score">
      <div id="teamName" class="tm">TEAM</div>
      <div style="display:flex; align-items:baseline;">
        <div class="sc"><span id="teamScore">0</span><span>/</span><span id="teamWickets">0</span></div>
        <div class="ov">OV <span id="teamOvers">0.0</span></div>
      </div>
    </div>

    <div class="bl-bowl">
      <div style="display:flex; flex-direction:column;"><span class="lbl">BOWLER</span><span id="bowlerName" class="pn">Bowler Name</span></div>
      <div style="display:flex; align-items:baseline;">
        <span class="ps" style="color:#fff; font-size: 38px;"><span id="bowlerWickets">0</span>-<span id="bowlerRuns">0</span></span> <span class="pb" style="margin-left:10px;">OV <span id="bowlerOvers">0.0</span></span>
      </div>
    </div>
    
    <div class="bl-bat" id="blade-bat">
      <div id="event-wipe">DECISION PENDING</div>
      <div style="display:flex; align-items:baseline;">
        <span style="color:#eab308; margin-right:8px; font-size:16px;">▶</span>
        <span id="strikerName" class="pn">Striker</span><span id="strikerRuns" class="ps">0</span> <span class="pb" style="margin-left: 5px;">(<span id="strikerBalls">0</span>)</span>
      </div>
      <div class="v-line"></div>
      <div style="display:flex; align-items:baseline; opacity: 0.7;">
        <span id="nonStrikerName" class="pn" style="color:#a1a1aa;">Non-Striker</span><span id="nonStrikerRuns" class="ps" style="color:#a1a1aa;">0</span>
      </div>
    </div>

  </div>

  <script>
    let pSc = -1, pWk = -1, iSt = 0, cDat = {}, wipeTimeout;
    const $ = id => document.getElementById(id);

    setInterval(() => {
      if(!cDat.tournamentName) return;
      iSt = (iSt + 1) % 3;
      if(iSt === 0) $('blade-island').innerText = cDat.tournamentName;
      else if(iSt === 1) $('blade-island').innerText = "SCOREX-LIVE.COM";
      else $('blade-island').innerText = "CRR: " + (cDat.runRate||'0.0');
    }, 4500);

    function triggerWipe(txt, bg, color, isPersistent) {
      const bat = $('blade-bat');
      const wipe = $('event-wipe');
      if(wipeTimeout) clearTimeout(wipeTimeout);
      
      wipe.innerText = txt; wipe.style.background = bg; wipe.style.color = color;
      bat.classList.add('show');
      
      if(!isPersistent) { wipeTimeout = setTimeout(() => { bat.classList.remove('show'); }, 3000); }
    }

    function processData(d) {
      cDat = d;
      if (d.team1Score == 0 && d.team1Overs === "0.0" && d.strikerRuns == 0 && d.tossWinner) {
        $('toss-overlay').style.display = 'flex'; $('toss-overlay').innerText = `${d.tossWinner} WON TOSS & ELECTED TO ${d.tossDecision}`;
      } else { $('toss-overlay').style.display = 'none'; }

      $('teamName').innerText = d.team1Name; $('teamScore').innerText = d.team1Score; $('teamWickets').innerText = d.team1Wickets; $('teamOvers').innerText = d.team1Overs;
      $('strikerName').innerText = d.strikerName; $('strikerRuns').innerText = d.strikerRuns; $('strikerBalls').innerText = d.strikerBalls;
      $('nonStrikerName').innerText = d.nonStrikerName; $('nonStrikerRuns').innerText = d.nonStrikerRuns;
      $('bowlerName').innerText = d.bowlerName; $('bowlerRuns').innerText = d.bowlerRuns; $('bowlerWickets').innerText = d.bowlerWickets; $('bowlerOvers').innerText = d.bowlerOvers;

      if (d.decisionPending) { triggerWipe("DECISION PENDING", "#eab308", "#111", true); return; } 
      else if ($('blade-bat').classList.contains('show') && $('event-wipe').innerText === "DECISION PENDING") { $('blade-bat').classList.remove('show'); }

      let ns = parseInt(d.team1Score)||0, nw = parseInt(d.team1Wickets)||0;
      if (pSc !== -1 && !d.decisionPending) {
        if (nw > pWk) triggerWipe("WICKET!", "#ef4444", "#fff"); 
        else if (ns - pSc === 6) triggerWipe("SIX RUNS", "#3b82f6", "#fff");
        else if (ns - pSc === 4) triggerWipe("BOUNDARY", "#fff", "#111");
      }
      pSc = ns; pWk = nw;
    }
    window.addEventListener('message', e => { if(e.data?.type === 'UPDATE_SCORE') processData(e.data.data); });
  </script>
</body>
</html>
