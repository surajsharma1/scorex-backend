<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreX - Lvl 2 Data Flow</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Saira:wght@500;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; overflow: hidden; color: #fff; font-family: 'Saira', sans-serif; text-transform: uppercase; }

    /* Animated Topographic Background Pattern */
    @keyframes bgScroll { 0% { background-position: 0 0; } 100% { background-position: -100px -100px; } }

    /* Floating Data Tag */
    #df-top {
      position: absolute; top: 20px; right: 40px;
      background: rgba(4, 9, 20, 0.9); border: 1px solid #00e5ff;
      padding: 6px 30px; font-family: 'Share Tech Mono', monospace; font-size: 15px; letter-spacing: 2px;
      color: #00e5ff; box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
      border-radius: 4px; display: flex; align-items: center; gap: 10px;
    }

    /* Warning / Event Popup */
    #df-event {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
      background: #ff0055; color: #fff; border: 4px solid #fff;
      padding: 10px 80px; font-size: 100px; font-weight: 900; letter-spacing: 5px;
      box-shadow: 0 0 40px rgba(255, 0, 85, 0.8), inset 0 0 20px rgba(0,0,0,0.5);
      opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #df-event.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    /* Bottom Flow Lockup */
    #df-bottom {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; width: 95%; max-width: 1400px;
      filter: drop-shadow(0 15px 20px rgba(0,0,0,0.7));
    }

    /* Base Flow Panels */
    .df-panel {
      background-color: #060b14;
      /* Data Grid Background */
      background-image: linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
      background-size: 20px 20px; animation: bgScroll 8s linear infinite;
      border: 1px solid #1a2a40; position: relative;
      display: flex; align-items: center; padding: 15px 30px;
    }
    /* Neon Accents on Top/Bottom of Panels */
    .df-panel::before { content: ''; position: absolute; top: -1px; left: 0; width: 30%; height: 3px; background: #00e5ff; box-shadow: 0 0 10px #00e5ff; }
    .df-panel::after { content: ''; position: absolute; bottom: -1px; right: 0; width: 30%; height: 3px; background: #ff0055; box-shadow: 0 0 10px #ff0055; }

    /* Sizing */
    .p-score { min-width: 350px; justify-content: space-between; border-left: 4px solid #00e5ff; }
    .p-bat { flex: 1; min-width: 380px; justify-content: space-around; }
    .p-bowl { min-width: 320px; justify-content: space-between; border-right: 4px solid #ff0055; }

    /* Typography */
    .t-lbl { font-size: 34px; font-weight: 900; line-height: 1; color: #fff; text-shadow: 0 0 10px rgba(0,229,255,0.5);}
    .s-lbl { font-size: 65px; font-weight: 900; line-height: 0.8; color: #00e5ff; }
    .s-lbl span { font-size: 30px; color: #475a75; }
    .o-lbl { font-family: 'Share Tech Mono', monospace; font-size: 16px; color: #ff0055; margin-left: 15px; font-weight: 700;}

    .grp { display: flex; flex-direction: column; }
    .hdr { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: #475a75; letter-spacing: 2px; margin-bottom: 2px;}
    
    .p-row { display: flex; align-items: baseline; gap: 15px; }
    .p-n { font-size: 24px; font-weight: 700; color: #e2e8f0; }
    .p-s { font-size: 42px; font-weight: 900; color: #fff; line-height: 0.9;}
    .p-b { font-family: 'Share Tech Mono', monospace; font-size: 14px; color: #475a75; }

    .striker { border-bottom: 1px solid rgba(0, 229, 255, 0.3); padding-bottom: 5px; margin-bottom: 5px;}
    .striker .p-s { color: #00e5ff; text-shadow: 0 0 15px rgba(0,229,255,0.5);}

    .p-bowl .p-s { color: #ff0055; text-shadow: 0 0 15px rgba(255,0,85,0.5);}

  </style>
</head>
<body>

  <div id="df-top"><span style="color:#ff0055;">●</span> <span id="tournamentName">DATA FLOW ACTIVE</span></div>
  <div id="df-event">CRITICAL WICKET</div>

  <div id="df-bottom">
    
    <div class="df-panel p-score">
      <div class="grp">
        <span class="hdr">ENTITY_NAME</span>
        <div id="teamName" class="t-lbl">TEAM</div>
      </div>
      <div style="display:flex; align-items:baseline;">
        <div class="s-lbl"><span id="teamScore">0</span><span>/</span><span id="teamWickets">0</span></div>
        <div class="o-lbl">OV <span id="teamOvers">0.0</span></div>
      </div>
    </div>

    <div class="df-panel p-bat">
      <div class="grp">
        <div class="p-row striker">
          <span id="strikerName" class="p-n">Striker</span>
          <div><span id="strikerRuns" class="p-s">0</span> <span class="p-b">(<span id="strikerBalls">0</span>)</span></div>
        </div>
        <div class="p-row" style="opacity: 0.6;">
          <span id="nonStrikerName" class="p-n">Non-Striker</span>
          <div><span id="nonStrikerRuns" class="p-s" style="font-size: 30px; color:#fff;">0</span> <span class="p-b">(<span id="nonStrikerBalls">0</span>)</span></div>
        </div>
      </div>
    </div>

    <div class="df-panel p-bowl">
      <div class="grp">
        <span class="hdr">VECTOR_ATTACK</span>
        <span id="bowlerName" class="p-n">Bowler Name</span>
      </div>
      <div style="text-align: right;">
        <div class="p-s"><span id="bowlerWickets">0</span>-<span id="bowlerRuns">0</span></div>
        <div class="p-b" style="color:#00e5ff;">OVERS <span id="bowlerOvers">0.0</span></div>
      </div>
    </div>

  </div>

  <div style="position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,0.4); font-family: sans-serif; letter-spacing: 2px; z-index: 10000; text-shadow: 0 1px 2px rgba(0,0,0,0.8); pointer-events: none;">
    https://scorex-live.vercel.app/
  </div>

  <script>
    let pSc = -1, pWk = -1, dfDat = {};
    const inject = (id, val) => { const e = document.getElementById(id); if(e && val != null) e.innerText = val; };

    function fireDataEvent(txt, bg, col, border) {
      const e = document.getElementById('df-event');
      e.innerText = txt; 
      e.style.background = bg; e.style.color = col; e.style.borderColor = border;
      e.classList.remove('show');
      void e.offsetWidth; 
      e.classList.add('show');
      setTimeout(() => e.classList.remove('show'), 2800);
    }

    setInterval(() => {
      const isl = document.getElementById('tournamentName');
      if(!dfDat.tournamentName) return;
      let st = Math.floor(Date.now() / 4500) % 3;
      if(st === 0) isl.innerText = dfDat.tournamentName;
      else if(st === 1) isl.innerText = "CRR_VELOCITY: " + (dfDat.runRate||'0.0');
      else isl.innerText = dfDat.target > 0 ? "TARGET_LOCK: " + dfDat.target : "SYSTEM_ONLINE";
    }, 4500);

    function rx(d) {
      dfDat = d;
      inject('teamName', d.team1Name); inject('teamScore', d.team1Score); inject('teamWickets', d.team1Wickets); inject('teamOvers', d.team1Overs);
      inject('strikerName', d.strikerName); inject('strikerRuns', d.strikerRuns); inject('strikerBalls', d.strikerBalls);
      inject('nonStrikerName', d.nonStrikerName); inject('nonStrikerRuns', d.nonStrikerRuns); inject('nonStrikerBalls', d.nonStrikerBalls);
      inject('bowlerName', d.bowlerName); inject('bowlerRuns', d.bowlerRuns); inject('bowlerWickets', d.bowlerWickets); inject('bowlerOvers', d.bowlerOvers);

      let ns = parseInt(d.team1Score)||0, nw = parseInt(d.team1Wickets)||0;
      if (pSc !== -1) {
        if (nw > pWk) fireDataEvent("WICKET DETECTED", "#ff0055", "#fff", "#fff");
        else if (ns - pSc === 6) fireDataEvent("MAXIMUM IMPACT", "#00e5ff", "#060b14", "#060b14");
        else if (ns - pSc === 4) fireDataEvent("BOUNDARY CLEARED", "#060b14", "#00e5ff", "#00e5ff");
      }
      pSc = ns; pWk = nw;
    }

    window.addEventListener('message', e => { if(e.data?.type === 'UPDATE_SCORE') rx(e.data.data); });
    if ('BroadcastChannel' in window) new BroadcastChannel('scorex_overlay_channel').onmessage = e => { if(e.data?.type === 'UPDATE_SCORE') rx(e.data.data); };
  </script>
</body>
</html>
