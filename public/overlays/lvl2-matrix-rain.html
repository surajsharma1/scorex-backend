<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreX - Lvl 2 Terminal Glitch</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; overflow: hidden; color: #0f0; font-family: 'Share Tech Mono', monospace; text-transform: uppercase; }

    @keyframes dropIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    
    @keyframes textGlitch {
      0% { transform: translate(0) }
      20% { transform: translate(-2px, 2px) }
      40% { transform: translate(-2px, -2px) }
      60% { transform: translate(2px, 2px) }
      80% { transform: translate(2px, -2px) }
      100% { transform: translate(0) }
    }

    /* Terminal Island */
    #term-island {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 15, 0, 0.9); border: 1px solid #0f0;
      padding: 6px 30px; font-size: 15px; letter-spacing: 2px;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.3); animation: dropIn 0.8s ease-out forwards;
    }
    #term-island::before { content: ">_ "; }

    #toss-overlay {
      position: absolute; inset: 0; background: rgba(0, 5, 0, 0.95);
      display: none; align-items: center; justify-content: center; z-index: 50;
      font-size: 35px; color: #0f0; border: 2px dashed #0f0;
    }

    #scoreboard-wrapper {
      position: absolute; bottom: 25px; left: 0; width: 100%; height: 80px;
      display: flex; justify-content: center; align-items: stretch; gap: 8px;
      z-index: 5; animation: dropIn 1s ease-out forwards;
    }

    .t-panel { 
      background: rgba(0, 10, 0, 0.95); border: 1px solid #0f0;
      display: flex; align-items: center; padding: 0 25px; position: relative;
    }
    .p-score { min-width: 320px; justify-content: space-between; border-left: 5px solid #0f0; }
    .p-bat { flex: 1; max-width: 500px; justify-content: space-around; overflow: hidden; }
    .p-bowl { min-width: 340px; justify-content: space-between; border-right: 5px solid #0f0; }

    /* The Glitch Event Box (Overlays the middle panel) */
    #glitch-event {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #0f0; color: #000; display: flex; align-items: center; justify-content: center;
      font-size: 45px; font-weight: 700; letter-spacing: 4px; z-index: 10;
      opacity: 0; pointer-events: none; transition: opacity 0.1s;
    }
    #glitch-event.active { opacity: 1; animation: textGlitch 0.2s infinite; }

    .tm { font-size: 18px; color: #0a0; line-height: 1; }
    .sc { font-size: 50px; color: #0f0; line-height: 0.9; }
    .sc span { font-size: 28px; color: #080; }
    .ov { font-size: 16px; color: #000; background: #0f0; padding: 2px 8px; margin-left: 15px;}

    .pn { font-size: 20px; color: #fff; }
    .ps { font-size: 40px; color: #0f0; margin-left: 10px; line-height: 0.9;}
    .pb { font-size: 14px; color: #0a0; margin-left: 5px;}
    .lbl { font-size: 12px; color: #0a0; margin-bottom: 2px;}
    .v-line { width: 1px; height: 100%; background: #0f0; border-right: 1px dashed #0f0; }
  </style>
</head>
<body>

  <div id="term-island">SCOREX-LIVE.COM</div>
  <div id="toss-overlay"></div>

  <div id="scoreboard-wrapper">
    <div class="t-panel p-score">
      <div style="display:flex; flex-direction:column;">
        <div id="teamName" class="tm">TEAM</div>
        <div style="display:flex; align-items:baseline;">
          <div class="sc"><span id="teamScore">0</span><span>/</span><span id="teamWickets">0</span></div>
          <div class="ov">OV <span id="teamOvers">0.0</span></div>
        </div>
      </div>
    </div>
    
    <div class="t-panel p-bat">
      <div id="glitch-event">WARN: DECISION PENDING</div>
      <div style="display:flex; align-items:baseline;">
        <span style="color:#0f0; margin-right:8px; font-size: 14px;">></span>
        <span id="strikerName" class="pn">Striker</span><span id="strikerRuns" class="ps">0</span> <span class="pb">(<span id="strikerBalls">0</span>)</span>
      </div>
      <div class="v-line"></div>
      <div style="display:flex; align-items:baseline; opacity: 0.7;">
        <span id="nonStrikerName" class="pn">Non-Striker</span><span id="nonStrikerRuns" class="ps" style="color:#aaa;">0</span>
      </div>
    </div>

    <div class="t-panel p-bowl">
      <div style="display:flex; flex-direction:column;"><span class="lbl">SYS.BOWLER</span><span id="bowlerName" class="pn">Bowler Name</span></div>
      <div style="display:flex; align-items:baseline;">
        <span class="ps" style="color:#fff;"><span id="bowlerWickets">0</span>-<span id="bowlerRuns">0</span></span> <span class="pb" style="margin-left:10px;">OV <span id="bowlerOvers">0.0</span></span>
      </div>
    </div>
  </div>

  <script>
    let pSc = -1, pWk = -1, iSt = 0, cDat = {}, glitchTimeout;
    const $ = id => document.getElementById(id);

    setInterval(() => {
      if(!cDat.tournamentName) return;
      iSt = (iSt + 1) % 3;
      if(iSt === 0) $('term-island').innerText = cDat.tournamentName;
      else if(iSt === 1) $('term-island').innerText = "SCOREX-LIVE.COM";
      else $('term-island').innerText = "SYS.CRR: " + (cDat.runRate||'0.0');
    }, 4500);

    function triggerGlitch(txt, bg, color, isPersistent) {
      const gl = $('glitch-event');
      if(glitchTimeout) clearTimeout(glitchTimeout);
      
      gl.innerText = `[ ${txt} ]`; 
      gl.style.background = bg;
      gl.style.color = color;
      
      gl.classList.add('active');
      if(!isPersistent) { glitchTimeout = setTimeout(() => { gl.classList.remove('active'); }, 3000); }
    }

    function processData(d) {
      cDat = d;
      if (d.team1Score == 0 && d.team1Overs === "0.0" && d.strikerRuns == 0 && d.tossWinner) {
        $('toss-overlay').style.display = 'flex'; $('toss-overlay').innerText = `> ${d.tossWinner} WON TOSS : EXEC ${d.tossDecision}`;
      } else { $('toss-overlay').style.display = 'none'; }

      $('teamName').innerText = d.team1Name; $('teamScore').innerText = d.team1Score; $('teamWickets').innerText = d.team1Wickets; $('teamOvers').innerText = d.team1Overs;
      $('strikerName').innerText = d.strikerName; $('strikerRuns').innerText = d.strikerRuns; $('strikerBalls').innerText = d.strikerBalls;
      $('nonStrikerName').innerText = d.nonStrikerName; $('nonStrikerRuns').innerText = d.nonStrikerRuns;
      $('bowlerName').innerText = d.bowlerName; $('bowlerRuns').innerText = d.bowlerRuns; $('bowlerWickets').innerText = d.bowlerWickets; $('bowlerOvers').innerText = d.bowlerOvers;

      if (d.decisionPending) { triggerGlitch("DECISION PENDING", "#ffcc00", "#000", true); return; } 
      else if ($('glitch-event').classList.contains('active') && $('glitch-event').innerText.includes("DECISION")) { $('glitch-event').classList.remove('active'); }

      let ns = parseInt(d.team1Score)||0, nw = parseInt(d.team1Wickets)||0;
      if (pSc !== -1 && !d.decisionPending) {
        if (nw > pWk) triggerGlitch("ERR: WICKET", "#f00", "#fff"); 
        else if (ns - pSc === 6) triggerGlitch("EXEC: SIX", "#0ff", "#000");
        else if (ns - pSc === 4) triggerGlitch("EXEC: FOUR", "#0f0", "#000");
      }
      pSc = ns; pWk = nw;
    }
    window.addEventListener('message', e => { if(e.data?.type === 'UPDATE_SCORE') processData(e.data.data); });
  </script>
</body>
</html>
