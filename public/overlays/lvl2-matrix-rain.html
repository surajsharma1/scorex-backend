<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreX - Lvl 2 Tactical Blueprint</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; overflow: hidden; color: #00f3ff; font-family: 'Share Tech Mono', monospace; text-transform: uppercase; }

    /* Tactical Top Tag */
    #bp-top {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      border: 1px solid #00f3ff; background: rgba(0, 24, 40, 0.7);
      padding: 5px 20px; font-size: 14px; letter-spacing: 4px;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }
    #bp-top::before, #bp-top::after {
      content: ''; position: absolute; width: 10px; height: 10px; border: 2px solid #00f3ff;
    }
    #bp-top::before { top: -4px; left: -4px; border-right: none; border-bottom: none; }
    #bp-top::after { bottom: -4px; right: -4px; border-left: none; border-top: none; }

    /* Alert Overlay */
    #bp-event {
      position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%);
      font-family: 'Rajdhani', sans-serif; font-size: 110px; font-weight: 700;
      color: transparent; -webkit-text-stroke: 2px #ff0055;
      text-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
      letter-spacing: 15px; opacity: 0; transition: all 0.2s ease;
    }
    #bp-event.show { opacity: 1; letter-spacing: 5px; }

    /* Blueprint Grid Container */
    #bp-bottom {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 15px; align-items: stretch; height: 100px;
    }

    /* Wireframe Panels */
    .bp-panel {
      position: relative; background: rgba(0, 20, 35, 0.6);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 10px 25px; display: flex; align-items: center;
      /* The Blueprint Grid Background */
      background-image: 
        linear-gradient(rgba(0, 243, 255, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.1) 1px, transparent 1px);
      background-size: 15px 15px;
    }

    /* Corner Targeting Brackets */
    .bp-panel::before, .bp-panel::after {
      content: ''; position: absolute; width: 15px; height: 15px; border: 2px solid #00f3ff;
    }
    .bp-panel::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .bp-panel::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    /* Center Panel Scanline Animation */
    .bp-center { min-width: 300px; justify-content: space-between; overflow: hidden; border-color: #00f3ff;}
    .bp-center .scanline {
      position: absolute; top: 0; left: 0; width: 100%; height: 2px;
      background: #00f3ff; box-shadow: 0 0 10px #00f3ff;
      animation: scan 3s linear infinite;
    }
    @keyframes scan { 0% { top: -10%; } 100% { top: 110%; } }

    /* Typography */
    .bp-bat { flex: 1; min-width: 380px; justify-content: space-around; }
    .bp-bowl { min-width: 280px; justify-content: space-between; }

    .t-lbl { font-family: 'Rajdhani', sans-serif; font-size: 32px; font-weight: 700; line-height: 1; color: #fff;}
    .sc-val { font-family: 'Rajdhani', sans-serif; font-size: 60px; font-weight: 700; line-height: 0.8;}
    .sc-val span { font-size: 30px; color: #0099aa; }
    .ov-val { font-size: 14px; background: #00f3ff; color: #001423; padding: 2px 6px; font-weight: 700;}

    .grp { display: flex; flex-direction: column; }
    .hdr { font-size: 12px; color: #0099aa; letter-spacing: 1px; margin-bottom: 2px;}
    .p-row { display: flex; align-items: baseline; justify-content: space-between; gap: 15px;}
    .p-n { font-size: 20px; color: #fff; font-family: 'Rajdhani', sans-serif; font-weight: 700;}
    .p-s { font-size: 32px; font-weight: 700; color: #00f3ff; font-family: 'Rajdhani', sans-serif;}
    .p-b { font-size: 14px; color: #0099aa; }

    .striker { border-bottom: 1px dashed #00f3ff; padding-bottom: 5px; margin-bottom: 5px;}
    .active-tag { font-size: 10px; background: #00f3ff; color: #000; padding: 0 4px; margin-right: 5px; vertical-align: middle;}

  </style>
</head>
<body>

  <div id="bp-top"><span id="tournamentName">SYS_INIT // STANDBY</span></div>
  <div id="bp-event"></div>

  <div id="bp-bottom">
    
    <div class="bp-panel bp-bat">
      <div class="grp">
        <div class="p-row striker">
          <div><span class="active-tag">ACT</span><span id="strikerName" class="p-n">Striker</span></div>
          <div><span id="strikerRuns" class="p-s">0</span> <span class="p-b">(<span id="strikerBalls">0</span>)</span></div>
        </div>
        <div class="p-row" style="opacity: 0.6;">
          <div><span style="display:inline-block; width: 25px;"></span><span id="nonStrikerName" class="p-n">Non-Striker</span></div>
          <div><span id="nonStrikerRuns" class="p-s" style="color:#fff;">0</span> <span class="p-b">(<span id="nonStrikerBalls">0</span>)</span></div>
        </div>
      </div>
    </div>

    <div class="bp-panel bp-center">
      <div class="scanline"></div>
      <div class="grp">
        <div class="hdr">TEAM IDENTIFIER</div>
        <div id="teamName" class="t-lbl">TEAM</div>
      </div>
      <div style="text-align: right;">
        <div class="sc-val"><span id="teamScore">0</span><span>/</span><span id="teamWickets">0</span></div>
        <div class="ov-val">OVERS: <span id="teamOvers">0.0</span></div>
      </div>
    </div>

    <div class="bp-panel bp-bowl">
      <div class="grp">
        <div class="hdr">BOWLING PROTOCOL</div>
        <span id="bowlerName" class="p-n">Bowler Name</span>
      </div>
      <div style="text-align: right;">
        <div class="p-s" style="color: #ff0055;"><span id="bowlerWickets">0</span>-<span id="bowlerRuns">0</span></div>
        <div class="p-b" style="color:#fff;">OVERS: <span id="bowlerOvers">0.0</span></div>
      </div>
    </div>

  </div>

  <div style="position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(0, 243, 255, 0.4); font-family: sans-serif; letter-spacing: 2px; z-index: 10000; text-shadow: 0 1px 2px rgba(0,0,0,0.8); pointer-events: none;">
    https://scorex-live.vercel.app/
  </div>

  <script>
    let pSc = -1, pWk = -1, tSt = 0, bpDat = {};
    const inject = (id, val) => { const e = document.getElementById(id); if(e && val != null) e.innerText = val; };

    function fireBlueprintEvent(txt, color) {
      const e = document.getElementById('bp-event');
      e.innerText = txt; 
      e.style.webkitTextStroke = `2px ${color}`;
      e.style.textShadow = `0 0 20px ${color}80`;
      e.classList.remove('show');
      void e.offsetWidth; 
      e.classList.add('show');
      setTimeout(() => e.classList.remove('show'), 2800);
    }

    setInterval(() => {
      const isl = document.getElementById('tournamentName');
      if(!bpDat.tournamentName) return;
      tSt = (tSt + 1) % 3;
      if(tSt === 0) isl.innerText = `[ ${bpDat.tournamentName} ]`;
      else if(tSt === 1) isl.innerText = `CRR_METRIC // ${bpDat.runRate||'0.0'}`;
      else isl.innerText = bpDat.target > 0 ? `TRG_LOCK // ${bpDat.target}` : `MODE // LIVE`;
    }, 4500);

    function rx(d) {
      bpDat = d;
      inject('teamName', d.team1Name); inject('teamScore', d.team1Score); inject('teamWickets', d.team1Wickets); inject('teamOvers', d.team1Overs);
      inject('strikerName', d.strikerName); inject('strikerRuns', d.strikerRuns); inject('strikerBalls', d.strikerBalls);
      inject('nonStrikerName', d.nonStrikerName); inject('nonStrikerRuns', d.nonStrikerRuns); inject('nonStrikerBalls', d.nonStrikerBalls);
      inject('bowlerName', d.bowlerName); inject('bowlerRuns', d.bowlerRuns); inject('bowlerWickets', d.bowlerWickets); inject('bowlerOvers', d.bowlerOvers);

      let ns = parseInt(d.team1Score)||0, nw = parseInt(d.team1Wickets)||0;
      if (pSc !== -1) {
        if (nw > pWk) fireBlueprintEvent("WICKET_DETECTED", "#ff0055");
        else if (ns - pSc === 6) fireBlueprintEvent("MAXIMUM_IMPACT", "#00f3ff");
        else if (ns - pSc === 4) fireBlueprintEvent("BOUNDARY_CLEARED", "#ffdd00");
      }
      pSc = ns; pWk = nw;
    }

    window.addEventListener('message', e => { if(e.data?.type === 'UPDATE_SCORE') rx(e.data.data); });
    if ('BroadcastChannel' in window) new BroadcastChannel('scorex_overlay_channel').onmessage = e => { if(e.data?.type === 'UPDATE_SCORE') rx(e.data.data); };
  </script>
</body>
</html>
