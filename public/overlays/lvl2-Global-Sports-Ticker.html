<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreX - Lvl 2 Classic Broadcast</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; overflow: hidden; color: #111; font-family: 'Roboto', sans-serif; text-transform: uppercase; }

    @keyframes fadeUp { 0% { transform: translateY(30px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

    #test-island {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: #0f172a; border-bottom: 3px solid #991b1b;
      padding: 6px 40px; font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); animation: fadeUp 0.8s ease-out forwards; z-index: 10;
    }

    #toss-overlay {
      position: absolute; inset: 0; background: rgba(255, 255, 255, 0.95);
      display: none; align-items: center; justify-content: center; z-index: 50;
      font-size: 35px; font-weight: 900; color: #991b1b; border: 8px solid #0f172a;
    }

    /* Main Container */
    #scoreboard-wrapper {
      position: absolute; bottom: 30px; left: 0; width: 100%; height: 75px;
      display: flex; flex-direction: column; align-items: center;
      z-index: 5; animation: fadeUp 1s ease-out forwards;
    }

    /* The Slide-Down Banner */
    #drop-banner {
      position: absolute; top: 10px; width: 60%; height: 60px;
      background: #991b1b; color: #fff; font-size: 32px; font-weight: 900; letter-spacing: 3px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 0 0 10px 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      z-index: 1; transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #drop-banner.show { transform: translateY(70px); }

    /* The Main White Bar */
    .test-bar {
      display: flex; width: 100%; height: 75px; background: #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); border-top: 4px solid #0f172a; border-bottom: 2px solid #ccc;
      z-index: 2;
    }
    
    .t-panel { display: flex; align-items: center; padding: 0 35px; border-right: 2px solid #e5e5e5; }
    .t-panel:last-child { border-right: none; }
    
    .p-score { min-width: 330px; justify-content: space-between; background: #0f172a; color: #fff; border-right: none;}
    .p-bat { flex: 1; max-width: 550px; justify-content: space-around; }
    .p-bowl { min-width: 340px; justify-content: space-between; }

    .tm { font-size: 24px; font-weight: 900; letter-spacing: 1px;}
    .sc { font-size: 46px; font-weight: 900; line-height: 1; }
    .sc span { font-size: 26px; color: #94a3b8; }
    .ov { font-size: 15px; font-weight: 700; color: #0f172a; background: #f1f5f9; padding: 3px 10px; margin-left: 15px; border-radius: 4px;}

    .pn { font-size: 20px; font-weight: 700; color: #111; }
    .ps { font-size: 38px; font-weight: 900; color: #991b1b; margin-left: 10px; line-height: 1;}
    .pb { font-size: 15px; color: #64748b; font-weight: 700; margin-left: 5px;}
    .lbl { font-size: 12px; color: #64748b; font-weight: 700; margin-bottom: 2px;}
    .v-line { width: 2px; height: 40px; background: #e5e5e5; }
  </style>
</head>
<body>

  <div id="test-island">SCOREX-LIVE.COM</div>
  <div id="toss-overlay"></div>

  <div id="scoreboard-wrapper">
    <div id="drop-banner">DECISION PENDING</div>
    <div class="test-bar">
      <div class="t-panel p-score">
        <div style="display:flex; flex-direction:column;">
          <div id="teamName" class="tm">TEAM</div>
          <div style="display:flex; align-items:baseline;">
            <div class="sc"><span id="teamScore">0</span><span>/</span><span id="teamWickets">0</span></div>
            <div class="ov">OV <span id="teamOvers">0.0</span></div>
          </div>
        </div>
      </div>
      
      <div class="t-panel p-bat">
        <div style="display:flex; align-items:baseline;">
          <span style="color:#991b1b; margin-right:8px; font-size:14px;">▶</span>
          <span id="strikerName" class="pn">Striker</span><span id="strikerRuns" class="ps">0</span> <span class="pb">(<span id="strikerBalls">0</span>)</span>
        </div>
        <div class="v-line"></div>
        <div style="display:flex; align-items:baseline; opacity: 0.6;">
          <span id="nonStrikerName" class="pn">Non-Striker</span><span id="nonStrikerRuns" class="ps" style="color:#111;">0</span>
        </div>
      </div>

      <div class="t-panel p-bowl">
        <div style="display:flex; flex-direction:column;"><span class="lbl">BOWLER</span><span id="bowlerName" class="pn">Bowler Name</span></div>
        <div style="display:flex; align-items:baseline;">
          <span class="ps" style="color:#111;"><span id="bowlerWickets">0</span>-<span id="bowlerRuns">0</span></span> <span class="pb" style="margin-left:10px;">OV <span id="bowlerOvers">0.0</span></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let pSc = -1, pWk = -1, iSt = 0, cDat = {}, bannerTimeout;
    const $ = id => document.getElementById(id);

    setInterval(() => {
      if(!cDat.tournamentName) return;
      iSt = (iSt + 1) % 3;
      if(iSt === 0) $('test-island').innerText = cDat.tournamentName;
      else if(iSt === 1) $('test-island').innerText = "SCOREX-LIVE.COM";
      else $('test-island').innerText = "CRR: " + (cDat.runRate||'0.0');
    }, 4500);

    function triggerBanner(txt, bg, color, isPersistent) {
      const banner = $('drop-banner');
      if(bannerTimeout) clearTimeout(bannerTimeout);
      
      banner.innerText = txt; 
      banner.style.background = bg; banner.style.color = color;
      
      banner.classList.add('show');
      if(!isPersistent) { bannerTimeout = setTimeout(() => { banner.classList.remove('show'); }, 3500); }
    }

    function processData(d) {
      cDat = d;
      if (d.team1Score == 0 && d.team1Overs === "0.0" && d.strikerRuns == 0 && d.tossWinner) {
        $('toss-overlay').style.display = 'flex'; $('toss-overlay').innerText = `${d.tossWinner} WON THE TOSS & CHOSE TO ${d.tossDecision}`;
      } else { $('toss-overlay').style.display = 'none'; }

      $('teamName').innerText = d.team1Name; $('teamScore').innerText = d.team1Score; $('teamWickets').innerText = d.team1Wickets; $('teamOvers').innerText = d.team1Overs;
      $('strikerName').innerText = d.strikerName; $('strikerRuns').innerText = d.strikerRuns; $('strikerBalls').innerText = d.strikerBalls;
      $('nonStrikerName').innerText = d.nonStrikerName; $('nonStrikerRuns').innerText = d.nonStrikerRuns;
      $('bowlerName').innerText = d.bowlerName; $('bowlerRuns').innerText = d.bowlerRuns; $('bowlerWickets').innerText = d.bowlerWickets; $('bowlerOvers').innerText = d.bowlerOvers;

      if (d.decisionPending) { triggerBanner("DECISION PENDING", "#d97706", "#fff", true); return; } 
      else if ($('drop-banner').classList.contains('show') && $('drop-banner').innerText === "DECISION PENDING") { $('drop-banner').classList.remove('show'); }

      let ns = parseInt(d.team1Score)||0, nw = parseInt(d.team1Wickets)||0;
      if (pSc !== -1 && !d.decisionPending) {
        if (nw > pWk) triggerBanner("WICKET", "#991b1b", "#fff"); 
        else if (ns - pSc === 6) triggerBanner("SIX RUNS", "#1e3a8a", "#fff");
        else if (ns - pSc === 4) triggerBanner("BOUNDARY", "#0f172a", "#fff");
      }
      pSc = ns; pWk = nw;
    }
    window.addEventListener('message', e => { if(e.data?.type === 'UPDATE_SCORE') processData(e.data.data); });
  </script>
</body>
</html>
