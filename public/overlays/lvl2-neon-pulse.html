<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreX - Lvl 2 Neon Pipeline</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Roboto+Mono:wght@700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; overflow: hidden; color: #fff; font-family: 'Outfit', sans-serif; text-transform: uppercase; }

    @keyframes slideUp { 0% { transform: translateY(40px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes pulseGlow { 0%, 100% { box-shadow: inset 0 0 5px #ccff00; } 50% { box-shadow: inset 0 0 15px #ccff00; } }

    #pipe-island {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: #000; border: 2px solid #ccff00; border-radius: 30px;
      padding: 6px 30px; font-family: 'Roboto Mono', monospace; font-size: 14px; letter-spacing: 2px; color: #ccff00;
      box-shadow: 0 5px 15px rgba(0,0,0,0.8), 0 0 10px rgba(204, 255, 0, 0.3);
      animation: slideUp 0.8s ease-out forwards; z-index: 10;
    }

    #toss-overlay {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.95);
      display: none; align-items: center; justify-content: center; z-index: 50;
      font-size: 38px; font-weight: 900; color: #ccff00; text-shadow: 0 0 20px rgba(204, 255, 0, 0.5);
    }

    /* Edge to Edge Wrapper */
    #scoreboard-wrapper {
      position: absolute; bottom: 25px; left: 0; width: 100%; height: 75px;
      display: flex; justify-content: center; align-items: stretch; gap: 6px; padding: 0 20px;
      z-index: 5; animation: slideUp 1s ease-out forwards;
    }

    .n-panel { 
      background: #050505; border: 2px solid #333;
      display: flex; align-items: center; padding: 0 35px; box-shadow: 0 10px 20px rgba(0,0,0,0.9);
      position: relative; overflow: hidden;
    }
    
    .p-score { min-width: 320px; justify-content: space-between; border-radius: 40px 10px 10px 40px; border-color: #ccff00; animation: pulseGlow 2s infinite;}
    .p-bat { flex: 1; max-width: 550px; justify-content: space-around; border-radius: 10px; }
    .p-bowl { min-width: 340px; justify-content: space-between; border-radius: 10px 40px 40px 10px; border-color: #00e5ff; }

    /* The Flash & Pop Event Layer */
    #neon-event {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #fff; color: #000;
      font-size: 45px; font-weight: 900; letter-spacing: 2px;
      transform: scale(0.8); opacity: 0; pointer-events: none;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 10;
    }
    .p-bat.active #neon-event { transform: scale(1); opacity: 1; border: 3px solid #fff; border-radius: 10px; }
    .p-bat.active { border-color: #fff; box-shadow: 0 0 30px rgba(255,255,255,0.8); z-index: 20;}

    /* Typography */
    .tm { font-size: 20px; font-weight: 900; color: #ccff00; line-height: 1;}
    .sc { font-family: 'Roboto Mono', monospace; font-size: 46px; font-weight: 700; line-height: 1; }
    .sc span { font-size: 26px; color: #555; }
    .ov { font-family: 'Roboto Mono', monospace; font-size: 15px; font-weight: 700; color: #000; background: #ccff00; padding: 2px 10px; margin-left: 15px; border-radius: 20px;}

    .pn { font-size: 22px; font-weight: 800; color: #fff; }
    .ps { font-family: 'Roboto Mono', monospace; font-size: 38px; font-weight: 700; color: #ccff00; margin-left: 10px; line-height: 1;}
    .pb { font-size: 15px; color: #888; font-weight: 600;}
    .lbl { font-size: 12px; color: #00e5ff; font-weight: 900; margin-bottom: 2px;}
    .v-line { width: 2px; height: 35px; background: #333; }
  </style>
</head>
<body>

  <div id="pipe-island">SCOREX-LIVE.COM</div>
  <div id="toss-overlay"></div>

  <div id="scoreboard-wrapper">
    <div class="n-panel p-score">
      <div style="display:flex; flex-direction:column;">
        <div id="teamName" class="tm">TEAM</div>
        <div style="display:flex; align-items:baseline;">
          <div class="sc"><span id="teamScore">0</span><span>/</span><span id="teamWickets">0</span></div>
          <div class="ov">OV <span id="teamOvers">0.0</span></div>
        </div>
      </div>
    </div>
    
    <div class="n-panel p-bat" id="center-neon">
      <div id="neon-event">DECISION PENDING</div>
      <div style="display:flex; align-items:baseline;">
        <span style="color:#ccff00; margin-right:8px; font-size:14px;">▶</span>
        <span id="strikerName" class="pn">Striker</span><span id="strikerRuns" class="ps">0</span> <span class="pb" style="margin-left: 5px;">(<span id="strikerBalls">0</span>)</span>
      </div>
      <div class="v-line"></div>
      <div style="display:flex; align-items:baseline; opacity: 0.6;">
        <span id="nonStrikerName" class="pn">Non-Striker</span><span id="nonStrikerRuns" class="ps" style="color:#fff;">0</span>
      </div>
    </div>

    <div class="n-panel p-bowl">
      <div style="display:flex; flex-direction:column;"><span class="lbl">BOWLER</span><span id="bowlerName" class="pn">Bowler Name</span></div>
      <div style="display:flex; align-items:baseline;">
        <span class="ps" style="color:#00e5ff;"><span id="bowlerWickets">0</span>-<span id="bowlerRuns">0</span></span> <span class="pb" style="margin-left:10px;">OV <span id="bowlerOvers">0.0</span></span>
      </div>
    </div>
  </div>

  <script>
    let pSc = -1, pWk = -1, iSt = 0, cDat = {}, neonTimeout;
    const $ = id => document.getElementById(id);

    setInterval(() => {
      if(!cDat.tournamentName) return;
      iSt = (iSt + 1) % 3;
      if(iSt === 0) $('pipe-island').innerText = cDat.tournamentName;
      else if(iSt === 1) $('pipe-island').innerText = "SCOREX-LIVE.COM";
      else $('pipe-island').innerText = "CRR: " + (cDat.runRate||'0.0');
    }, 4500);

    function triggerNeon(txt, bg, color, isPersistent) {
      const panel = $('center-neon');
      const ev = $('neon-event');
      if(neonTimeout) clearTimeout(neonTimeout);
      
      ev.innerText = txt; 
      ev.style.background = bg; ev.style.color = color;
      
      panel.classList.add('active');
      if(!isPersistent) { neonTimeout = setTimeout(() => { panel.classList.remove('active'); }, 3000); }
    }

    function processData(d) {
      cDat = d;
      if (d.team1Score == 0 && d.team1Overs === "0.0" && d.strikerRuns == 0 && d.tossWinner) {
        $('toss-overlay').style.display = 'flex'; $('toss-overlay').innerText = `${d.tossWinner} WON TOSS & ELECTED TO ${d.tossDecision}`;
      } else { $('toss-overlay').style.display = 'none'; }

      $('teamName').innerText = d.team1Name; $('teamScore').innerText = d.team1Score; $('teamWickets').innerText = d.team1Wickets; $('teamOvers').innerText = d.team1Overs;
      $('strikerName').innerText = d.strikerName; $('strikerRuns').innerText = d.strikerRuns; $('strikerBalls').innerText = d.strikerBalls;
      $('nonStrikerName').innerText = d.nonStrikerName; $('nonStrikerRuns').innerText = d.nonStrikerRuns;
      $('bowlerName').innerText = d.bowlerName; $('bowlerRuns').innerText = d.bowlerRuns; $('bowlerWickets').innerText = d.bowlerWickets; $('bowlerOvers').innerText = d.bowlerOvers;

      if (d.decisionPending) { triggerNeon("DECISION PENDING", "#fbbf24", "#000", true); return; } 
      else if ($('center-neon').classList.contains('active') && $('neon-event').innerText === "DECISION PENDING") { $('center-neon').classList.remove('active'); }

      let ns = parseInt(d.team1Score)||0, nw = parseInt(d.team1Wickets)||0;
      if (pSc !== -1 && !d.decisionPending) {
        if (nw > pWk) triggerNeon("WICKET", "#ff0033", "#fff"); 
        else if (ns - pSc === 6) triggerNeon("SIX RUNS", "#00e5ff", "#000");
        else if (ns - pSc === 4) triggerNeon("BOUNDARY", "#ccff00", "#000");
      }
      pSc = ns; pWk = nw;
    }
    window.addEventListener('message', e => { if(e.data?.type === 'UPDATE_SCORE') processData(e.data.data); });
  </script>
</body>
</html>
