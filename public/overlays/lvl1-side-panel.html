<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreX - Lvl 1 Clean Sidebar</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;500;700&family=Roboto:wght@400;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    body { background: transparent; overflow: hidden; color: #fff; }

    /* The Sidebar Container */
    #sidebar {
      position: absolute; top: 0; left: 0; width: 220px; height: 100vh;
      background: linear-gradient(to right, rgba(15, 20, 25, 0.95), rgba(15, 20, 25, 0.8));
      border-right: 2px solid #e91e63;
      box-shadow: 5px 0 25px rgba(0,0,0,0.8);
      display: flex; flex-direction: column;
    }

    /* Blocks inside sidebar */
    .block { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .block:last-child { border-bottom: none; }

    /* Tournament & Status */
    .b-tourney { background: #e91e63; color: #fff; text-align: center; padding: 15px 10px; }
    .tourney-text { font-family: 'Teko', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 1px; line-height: 1.1; }

    /* Main Score */
    .b-score { text-align: center; padding: 30px 10px; }
    .tm-name { font-family: 'Teko', sans-serif; font-size: 42px; font-weight: 700; line-height: 1; color: #fff; }
    .tm-sc { font-family: 'Teko', sans-serif; font-size: 60px; font-weight: 700; color: #ffeb3b; line-height: 1; margin: 5px 0;}
    .tm-sc span { font-size: 35px; color: #ccc; }
    .tm-ov { font-size: 16px; font-weight: 700; color: #aaa; background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 20px; display: inline-block;}

    /* Players */
    .b-label { font-size: 12px; color: #e91e63; font-weight: 700; letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }
    .player-row { margin-bottom: 15px; }
    .player-row:last-child { margin-bottom: 0; }
    .p-name { font-size: 18px; font-weight: 700; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p-stat { font-family: 'Teko', sans-serif; font-size: 32px; font-weight: 700; line-height: 1; color: #fff; }
    .p-balls { font-size: 14px; color: #888; margin-left: 5px; }

    .striker .p-name { color: #ffeb3b; }
    .striker .p-name::before { content: '▶ '; font-size: 12px; }

    /* Bowler */
    .bowl-stat { color: #00e5ff; }

    /* Event Popup (Centered on Screen, outside sidebar) */
    #sidebar-event {
      position: absolute; top: 40%; left: calc(50% + 110px); transform: translate(-50%, -50%) scale(0.5);
      background: #e91e63; color: #fff; font-family: 'Teko', sans-serif; font-size: 100px; line-height: 1;
      padding: 10px 50px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      opacity: 0; transition: all 0.2s ease-out; pointer-events: none;
    }
    #sidebar-event.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  </style>
</head>
<body>

  <div id="sidebar">
    <div class="block b-tourney">
      <div id="tournamentName" class="tourney-text">LIVE MATCH</div>
    </div>

    <div class="block b-score">
      <div id="teamName" class="tm-name">TEAM</div>
      <div class="tm-sc"><span id="teamScore">0</span><span>/</span><span id="teamWickets">0</span></div>
      <div class="tm-ov">OVERS: <span id="teamOvers">0.0</span></div>
    </div>

    <div class="block">
      <div class="b-label">BATSMEN</div>
      <div class="player-row striker">
        <span id="strikerName" class="p-name">Striker</span>
        <div><span id="strikerRuns" class="p-stat">0</span><span class="p-balls">(<span id="strikerBalls">0</span>)</span></div>
      </div>
      <div class="player-row" style="opacity: 0.7;">
        <span id="nonStrikerName" class="p-name">Non-Striker</span>
        <div><span id="nonStrikerRuns" class="p-stat">0</span><span class="p-balls">(<span id="nonStrikerBalls">0</span>)</span></div>
      </div>
    </div>

    <div class="block" style="flex: 1;">
      <div class="b-label">BOWLER</div>
      <div class="player-row">
        <span id="bowlerName" class="p-name">Bowler</span>
        <div><span class="p-stat bowl-stat"><span id="bowlerWickets">0</span>-<span id="bowlerRuns">0</span></span></div>
        <div class="p-balls" style="margin-left:0; margin-top: 2px;">OVERS: <span id="bowlerOvers">0.0</span></div>
      </div>
    </div>
  </div>

  <div id="sidebar-event"></div>

  <div style="position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(253, 69, 69, 0.741); font-family: sans-serif; letter-spacing: 1px; z-index: 10000; text-shadow: 0 1px 2px rgba(0,0,0,0.8); pointer-events: none;">
    https://scorex-live.vercel.app/
  </div>

  <script>
    let cSc = -1, cWk = -1;
    const update = (id, val) => { const e = document.getElementById(id); if(e && val != null) e.innerText = val; };

    function popEvent(txt, bg) {
      const e = document.getElementById('sidebar-event');
      e.innerText = txt; e.style.background = bg;
      e.classList.add('show');
      setTimeout(() => e.classList.remove('show'), 2800);
    }

    function processData(d) {
      update('tournamentName', d.tournamentName || 'LIVE MATCH');
      update('teamName', d.team1Name); 
      update('teamScore', d.team1Score); 
      update('teamWickets', d.team1Wickets); 
      update('teamOvers', d.team1Overs);
      
      update('strikerName', d.strikerName); update('strikerRuns', d.strikerRuns); update('strikerBalls', d.strikerBalls);
      update('nonStrikerName', d.nonStrikerName); update('nonStrikerRuns', d.nonStrikerRuns); update('nonStrikerBalls', d.nonStrikerBalls);
      
      update('bowlerName', d.bowlerName); update('bowlerRuns', d.bowlerRuns); update('bowlerWickets', d.bowlerWickets); update('bowlerOvers', d.bowlerOvers);

      let ns = parseInt(d.team1Score)||0, nw = parseInt(d.team1Wickets)||0;
      if (cSc !== -1) {
        if (nw > cWk) popEvent("WICKET!", "#e91e63");
        else if (ns - cSc === 6) popEvent("SIX RUNS!", "#00e5ff");
        else if (ns - cSc === 4) popEvent("FOUR RUNS!", "#ffeb3b");
      }
      cSc = ns; cWk = nw;
    }

    window.addEventListener('message', e => { if(e.data?.type === 'UPDATE_SCORE') processData(e.data.data); });
    if ('BroadcastChannel' in window) new BroadcastChannel('scorex_overlay_channel').onmessage = e => { if(e.data?.type === 'UPDATE_SCORE') processData(e.data.data); };
  </script>
</body>
</html>
