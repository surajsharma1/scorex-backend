<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreX - Lvl 1 Simple Circular</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: transparent; overflow: hidden; color: #ffffff; }

    /* Top Pill Island */
    #circ-island {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #38bdf8; font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      padding: 8px 30px; border-radius: 40px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    /* Circular Event Popup */
    #circ-event {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0);
      width: 250px; height: 250px; border-radius: 50%;
      background: rgba(15, 23, 42, 0.95); border: 4px solid #38bdf8;
      display: flex; align-items: center; justify-content: center; text-align: center;
      font-size: 48px; font-weight: 800; text-transform: uppercase; color: #fff;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.5);
      opacity: 0; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #circ-event.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    /* Bottom Assembly */
    #circ-bottom {
      position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; justify-content: center; gap: 20px;
      width: 100%;
    }

    /* Floating Pill Panels */
    .pill-panel {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 50px;
      padding: 10px 30px; display: flex; align-items: center; justify-content: space-around;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      min-width: 320px; height: 75px;
    }

    /* Central Score Circle */
    .score-circle {
      width: 150px; height: 150px; border-radius: 50%;
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      border: 3px solid #38bdf8;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 20px rgba(56, 189, 248, 0.2);
      z-index: 10; margin-bottom: 20px; /* Pushes it slightly up */
    }

    /* Typography inside modules */
    .tm-acr { font-size: 22px; font-weight: 800; color: #38bdf8; line-height: 1; margin-bottom: 2px;}
    .sc-main { font-size: 42px; font-weight: 800; line-height: 1; color: #fff; }
    .sc-main span { font-size: 22px; color: #94a3b8; }
    .ov-txt { font-size: 14px; font-weight: 600; color: #cbd5e1; margin-top: 2px;}

    .grp { display: flex; align-items: baseline; gap: 8px;}
    .p-name { font-size: 18px; font-weight: 600; color: #f8fafc; }
    .p-stat { font-size: 24px; font-weight: 700; color: #fff; }
    .p-sub { font-size: 13px; font-weight: 400; color: #94a3b8; }
    
    .striker { color: #facc15; }
    .striker .p-stat { color: #facc15; }

    .bowl-hl { color: #f43f5e; }

    /* Vertical Divider for Pills */
    .v-div { width: 1px; height: 40px; background: rgba(255,255,255,0.1); margin: 0 15px; }

  </style>
</head>
<body>

  <div id="circ-island"><span id="tournamentName">LIVE MATCH</span></div>
  <div id="circ-event"></div>

  <div id="circ-bottom">
    
    <div class="pill-panel">
      <div class="grp striker">
        <span style="font-size:12px; margin-right:-4px;">▶</span>
        <span id="strikerName" class="p-name" style="color:#facc15;">Striker</span>
        <span id="strikerRuns" class="p-stat">0</span>
        <span class="p-sub">(<span id="strikerBalls">0</span>)</span>
      </div>
      <div class="v-div"></div>
      <div class="grp" style="opacity: 0.7;">
        <span id="nonStrikerName" class="p-name">NonStrk</span>
        <span id="nonStrikerRuns" class="p-stat" style="font-size: 20px;">0</span>
      </div>
    </div>

    <div class="score-circle">
      <div id="teamName" class="tm-acr">TEAM</div>
      <div class="sc-main"><span id="teamScore">0</span><span>/</span><span id="teamWickets">0</span></div>
      <div class="ov-txt">OV <span id="teamOvers">0.0</span></div>
    </div>

    <div class="pill-panel">
      <div style="display:flex; flex-direction:column; align-items:flex-start; line-height: 1.2;">
        <span class="p-sub" style="color:#38bdf8; font-weight:700; text-transform:uppercase;">Bowler</span>
        <span id="bowlerName" class="p-name">Bowler Name</span>
      </div>
      <div class="v-div"></div>
      <div class="grp">
        <span class="p-stat bowl-hl"><span id="bowlerWickets">0</span>-<span id="bowlerRuns">0</span></span>
        <span class="p-sub">Ov <span id="bowlerOvers">0.0</span></span>
      </div>
    </div>

  </div>

  <div style="position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(253, 69, 69, 0.741); font-family: sans-serif; letter-spacing: 1px; z-index: 10000; text-shadow: 0 1px 2px rgba(0,0,0,0.8); pointer-events: none;">
    https://scorex-live.vercel.app/
  </div>

  <script>
    let pSc = -1, pWk = -1, iState = 0, cDat = {};
    const inject = (id, val) => { const e = document.getElementById(id); if(e && val != null) e.innerText = val; };

    function popCircle(txt, color) {
      const e = document.getElementById('circ-event');
      e.innerText = txt; 
      e.style.borderColor = color; 
      e.style.boxShadow = `0 0 40px ${color}80`; /* adds 50% opacity to hex */
      e.classList.add('show');
      setTimeout(() => e.classList.remove('show'), 2800);
    }

    setInterval(() => {
      const isl = document.getElementById('tournamentName');
      if(!cDat.tournamentName) return;
      iState = (iState + 1) % 3;
      if(iState === 0) isl.innerText = cDat.tournamentName;
      else if(iState === 1) isl.innerText = "CRR: " + (cDat.runRate||'0.0');
      else isl.innerText = cDat.target > 0 ? "TARGET: " + cDat.target : "1ST INNINGS";
    }, 4500);

    function processData(d) {
      cDat = d;
      // Truncate team name for circular fit if needed
      let tName = d.team1Name || 'TM';
      if(tName.length > 12) tName = tName.substring(0, 3).toUpperCase();
      
      inject('teamName', tName); 
      inject('teamScore', d.team1Score); 
      inject('teamWickets', d.team1Wickets); 
      inject('teamOvers', d.team1Overs);
      
      inject('strikerName', d.strikerName); inject('strikerRuns', d.strikerRuns); inject('strikerBalls', d.strikerBalls);
      inject('nonStrikerName', d.nonStrikerName); inject('nonStrikerRuns', d.nonStrikerRuns);
      
      inject('bowlerName', d.bowlerName); inject('bowlerRuns', d.bowlerRuns); inject('bowlerWickets', d.bowlerWickets); inject('bowlerOvers', d.bowlerOvers);

      let ns = parseInt(d.team1Score)||0, nw = parseInt(d.team1Wickets)||0;
      if (pSc !== -1) {
        if (nw > pWk) popCircle("WICKET", "#f43f5e"); // Red
        else if (ns - pSc === 6) popCircle("SIX", "#38bdf8"); // Blue
        else if (ns - pSc === 4) popCircle("FOUR", "#facc15"); // Yellow
      }
      pSc = ns; pWk = nw;
    }

    window.addEventListener('message', e => { if(e.data?.type === 'UPDATE_SCORE') processData(e.data.data); });
    if ('BroadcastChannel' in window) new BroadcastChannel('scorex_overlay_channel').onmessage = e => { if(e.data?.type === 'UPDATE_SCORE') processData(e.data.data); };
  </script>
</body>
</html>
