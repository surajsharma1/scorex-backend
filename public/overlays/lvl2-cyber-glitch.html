<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreX - Lvl 2 Folded Console</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Oswald:wght@500;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; overflow: hidden; color: #fff; font-family: 'Oswald', sans-serif; }

    /* Floating Top Tab */
    #fold-top {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: #ff4713; color: #fff;
      padding: 5px 30px; font-size: 16px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      box-shadow: 0 10px 20px rgba(255, 71, 19, 0.4);
      border-radius: 4px; border-bottom: 3px solid #b32a00;
    }

    /* Stamping Event Popup */
    #fold-event {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(3);
      font-family: 'Teko', sans-serif; font-size: 180px; font-weight: 700; color: #fff; line-height: 1;
      text-shadow: 0 15px 30px rgba(0,0,0,0.8);
      opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #fold-event.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    /* The 3D Console Wrapper */
    #console-wrapper {
      position: absolute; bottom: 30px; left: 0; width: 100%;
      display: flex; justify-content: center; align-items: flex-end;
      perspective: 1200px; /* Crucial for 3D effect */
    }

    /* Common Panel Style */
    .c-panel {
      background: linear-gradient(180deg, #1c2128 0%, #0d1117 100%);
      border: 2px solid #30363d;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 2px 0 rgba(255,255,255,0.1);
      padding: 15px 30px;
    }

    /* Left Wing - Angled Inward */
    .p-left {
      width: 350px; height: 90px;
      transform: rotateY(25deg) translateZ(-30px); transform-origin: right center;
      border-right: none; border-radius: 8px 0 0 8px;
      display: flex; flex-direction: column; justify-content: space-around;
    }

    /* Center Console - Pops Out */
    .p-center {
      width: 320px; height: 120px;
      transform: translateZ(40px); z-index: 10;
      border-bottom: 6px solid #ff4713; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #24292e 0%, #111418 100%);
    }

    /* Right Wing - Angled Inward */
    .p-right {
      width: 350px; height: 90px;
      transform: rotateY(-25deg) translateZ(-30px); transform-origin: left center;
      border-left: none; border-radius: 0 8px 8px 0;
      display: flex; flex-direction: column; justify-content: space-around;
    }

    /* Typography */
    .tm-n { font-size: 24px; font-weight: 700; color: #8b949e; letter-spacing: 1px; margin-bottom: 5px; text-transform: uppercase;}
    .sc-m { font-family: 'Teko', sans-serif; font-size: 70px; line-height: 0.8; font-weight: 700; color: #fff;}
    .sc-m span { font-size: 35px; color: #ff4713; }
    .ov-m { font-size: 16px; font-weight: 700; color: #fff; background: #ff4713; padding: 2px 10px; border-radius: 4px; position: absolute; top: -12px; right: 10px;}

    .row { display: flex; justify-content: space-between; align-items: baseline; }
    .pl-n { font-size: 20px; font-weight: 700; color: #c9d1d9; }
    .pl-s { font-family: 'Teko', sans-serif; font-size: 36px; font-weight: 700; color: #58a6ff; line-height: 0.9;}
    .pl-b { font-size: 14px; color: #8b949e; }
    
    .striker { color: #fff; }
    .striker .pl-s { color: #fff; }
    
    .lbl { font-size: 12px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; margin-bottom: -5px;}

  </style>
</head>
<body>

  <div id="fold-top"><span id="tournamentName">INTERNATIONAL BROADCAST</span></div>
  <div id="fold-event"></div>

  <div id="console-wrapper">
    
    <div class="c-panel p-left">
      <div class="row striker">
        <span id="strikerName" class="pl-n">▶ Striker</span>
        <div><span id="strikerRuns" class="pl-s">0</span> <span class="pl-b">(<span id="strikerBalls">0</span>)</span></div>
      </div>
      <div class="row" style="opacity: 0.6;">
        <span id="nonStrikerName" class="pl-n" style="margin-left: 18px;">Non-Striker</span>
        <div><span id="nonStrikerRuns" class="pl-s" style="font-size: 26px;">0</span> <span class="pl-b">(<span id="nonStrikerBalls">0</span>)</span></div>
      </div>
    </div>

    <div class="c-panel p-center">
      <div class="ov-m">OV <span id="teamOvers">0.0</span></div>
      <div id="teamName" class="tm-n">TEAM</div>
      <div class="sc-m"><span id="teamScore">0</span><span>/</span><span id="teamWickets">0</span></div>
    </div>

    <div class="c-panel p-right">
      <span class="lbl">CURRENT BOWLER</span>
      <div class="row" style="margin-top: 5px;">
        <span id="bowlerName" class="pl-n" style="color: #fff;">Bowler Name</span>
        <span class="pl-s" style="color: #ff4713;"><span id="bowlerWickets">0</span>-<span id="bowlerRuns">0</span></span>
      </div>
      <div style="text-align: right; font-size: 14px; color: #8b949e; font-weight: 700;">
        OVERS <span id="bowlerOvers" style="color:#c9d1d9;">0.0</span>
      </div>
    </div>

  </div>

  <div style="position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,0.4); font-family: sans-serif; letter-spacing: 2px; z-index: 10000; text-shadow: 0 1px 2px rgba(0,0,0,0.8); pointer-events: none;">
    https://scorex-live.vercel.app/
  </div>

  <script>
    let cSc = -1, cWk = -1, cDat = {};
    const inject = (id, val) => { const e = document.getElementById(id); if(e && val != null) e.innerText = val; };

    function fireFoldEvent(txt, color) {
      const e = document.getElementById('fold-event');
      e.innerText = txt; e.style.color = color;
      e.classList.remove('show');
      void e.offsetWidth; 
      e.classList.add('show');
    }

    setInterval(() => {
      const isl = document.getElementById('tournamentName');
      if(!cDat.tournamentName) return;
      let st = Math.floor(Date.now() / 4000) % 3;
      if(st === 0) isl.innerText = cDat.tournamentName;
      else if(st === 1) isl.innerText = "CRR: " + (cDat.runRate||'0.0');
      else isl.innerText = cDat.target > 0 ? "TARGET: " + cDat.target : "LIVE BROADCAST";
    }, 4000);

    function rx(d) {
      cDat = d;
      inject('teamName', d.team1Name); inject('teamScore', d.team1Score); inject('teamWickets', d.team1Wickets); inject('teamOvers', d.team1Overs);
      inject('strikerName', d.strikerName); inject('strikerRuns', d.strikerRuns); inject('strikerBalls', d.strikerBalls);
      inject('nonStrikerName', d.nonStrikerName); inject('nonStrikerRuns', d.nonStrikerRuns); inject('nonStrikerBalls', d.nonStrikerBalls);
      inject('bowlerName', d.bowlerName); inject('bowlerRuns', d.bowlerRuns); inject('bowlerWickets', d.bowlerWickets); inject('bowlerOvers', d.bowlerOvers);

      let ns = parseInt(d.team1Score)||0, nw = parseInt(d.team1Wickets)||0;
      if (cSc !== -1) {
        if (nw > cWk) fireFoldEvent("WICKET", "#ff4713");
        else if (ns - cSc === 6) fireFoldEvent("SIX", "#58a6ff");
        else if (ns - cSc === 4) fireFoldEvent("FOUR", "#fff");
      }
      cSc = ns; cWk = nw;
    }

    window.addEventListener('message', e => { if(e.data?.type === 'UPDATE_SCORE') rx(e.data.data); });
    if ('BroadcastChannel' in window) new BroadcastChannel('scorex_overlay_channel').onmessage = e => { if(e.data?.type === 'UPDATE_SCORE') rx(e.data.data); };
  </script>
</body>
</html>
