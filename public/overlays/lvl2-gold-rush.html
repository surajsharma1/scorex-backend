<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreX - Lvl 2 Hex-Core</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Saira:wght@500;700;900&family=Share+Tech&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; overflow: hidden; color: #fff; font-family: 'Saira', sans-serif; text-transform: uppercase; }

    /* Industrial Hex Top Island */
    #hex-top {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      background: #0b1319; border: 2px solid #ffb703;
      padding: 8px 40px; font-weight: 900; font-size: 16px; letter-spacing: 3px;
      color: #ffb703;
      clip-path: polygon(15px 0, calc(100% - 15px) 0, 100% 50%, calc(100% - 15px) 100%, 15px 100%, 0 50%);
      box-shadow: 0 10px 20px rgba(0,0,0,0.8);
    }

    /* Hexagonal Event Popup */
    #hex-event {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
      background: rgba(255, 183, 3, 0.9); color: #000;
      padding: 20px 80px; font-size: 100px; font-weight: 900; line-height: 1;
      clip-path: polygon(30px 0, calc(100% - 30px) 0, 100% 50%, calc(100% - 30px) 100%, 30px 100%, 0 50%);
      box-shadow: inset 0 0 0 5px #000;
      opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #hex-event.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    /* Bottom Interlocking Wrapper */
    #hex-bottom {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; filter: drop-shadow(0 15px 20px rgba(0,0,0,0.8));
    }

    /* Core Modules */
    .hex-module {
      background: linear-gradient(135deg, #15222b 0%, #0b1319 100%);
      height: 95px; display: flex; align-items: center; padding: 0 30px;
      border: 2px solid #3e5060; border-top: 4px solid #ffb703;
    }

    /* The Central Score Hub */
    .mod-score {
      min-width: 320px; justify-content: space-between; position: relative; z-index: 3;
      clip-path: polygon(20px 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 20px 100%, 0 50%);
      background: linear-gradient(135deg, #ffb703 0%, #fb8500 100%);
      color: #0b1319; border: none; margin: 0 -15px; /* Overlap trick */
    }

    .mod-bat {
      flex: 1; min-width: 350px; justify-content: space-around; z-index: 2;
      clip-path: polygon(0 0, 100% 0, calc(100% - 20px) 50%, 100% 100%, 0 100%, 20px 50%);
      padding-left: 50px;
    }

    .mod-bowl {
      min-width: 300px; justify-content: space-between; z-index: 1; margin-left: -15px;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 20px 50%);
      padding-left: 45px;
    }

    /* Typography */
    .tm-lbl { font-size: 34px; font-weight: 900; line-height: 1; letter-spacing: -1px; }
    .sc-lbl { font-size: 58px; font-weight: 900; line-height: 0.8; }
    .sc-lbl span { font-size: 32px; color: #663300; }
    .ov-lbl { font-family: 'Share Tech', sans-serif; font-size: 16px; font-weight: 700; color: #000; margin-left: 10px; background: rgba(255,255,255,0.4); padding: 2px 8px; border-radius: 3px;}

    .grp-col { display: flex; flex-direction: column; justify-content: center; }
    .sub-head { font-family: 'Share Tech', sans-serif; font-size: 14px; color: #8ecae6; margin-bottom: 2px;}
    
    .p-n { font-size: 22px; font-weight: 700; color: #fff; }
    .p-st { font-size: 34px; font-weight: 900; color: #ffb703; line-height: 0.9;}
    .p-bl { font-family: 'Share Tech', sans-serif; font-size: 16px; color: #8ecae6; }

    .striker { border-bottom: 3px solid #ffb703; padding-bottom: 2px; }
    
  </style>
</head>
<body>

  <div id="hex-top"><span id="tournamentName">TOURNAMENT FEED</span></div>
  <div id="hex-event"></div>

  <div id="hex-bottom">
    
    <div class="hex-module mod-bat">
      <div class="grp-col striker">
        <div><span style="color:#ffb703; font-size:14px;">▶</span> <span id="strikerName" class="p-n">Striker</span></div>
        <div style="display:flex; align-items:baseline; gap:8px;">
          <span id="strikerRuns" class="p-st">0</span> <span class="p-bl">(<span id="strikerBalls">0</span>)</span>
        </div>
      </div>
      <div class="grp-col" style="opacity: 0.6;">
        <span id="nonStrikerName" class="p-n">Non-Striker</span>
        <div style="display:flex; align-items:baseline; gap:8px;">
          <span id="nonStrikerRuns" class="p-st" style="color:#fff;">0</span> <span class="p-bl">(<span id="nonStrikerBalls">0</span>)</span>
        </div>
      </div>
    </div>

    <div class="hex-module mod-score">
      <div id="teamName" class="tm-lbl">TEAM</div>
      <div style="display: flex; align-items: baseline;">
        <div class="sc-lbl"><span id="teamScore">0</span><span>/</span><span id="teamWickets">0</span></div>
        <div class="ov-lbl">OV <span id="teamOvers">0.0</span></div>
      </div>
    </div>

    <div class="hex-module mod-bowl">
      <div class="grp-col">
        <span class="sub-head">BOWLER IN ACTION</span>
        <span id="bowlerName" class="p-n">Bowler Name</span>
      </div>
      <div style="text-align: right;">
        <div class="p-st" style="color: #219ebc;"><span id="bowlerWickets">0</span>-<span id="bowlerRuns">0</span></div>
        <div class="p-bl" style="color: #fff;">OVERS <span id="bowlerOvers">0.0</span></div>
      </div>
    </div>

  </div>

  <div style="position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,0.4); font-family: sans-serif; letter-spacing: 1px; z-index: 10000; text-shadow: 0 1px 2px rgba(0,0,0,0.8); pointer-events: none;">
    https://scorex-live.vercel.app/
  </div>

  <script>
    let cSc = -1, cWk = -1, tSt = 0, cDat = {};
    const inject = (id, val) => { const e = document.getElementById(id); if(e && val != null) e.innerText = val; };

    function fireHexEvent(txt, bg, color) {
      const e = document.getElementById('hex-event');
      e.innerText = txt; 
      e.style.background = bg; e.style.color = color;
      e.classList.add('show');
      setTimeout(() => e.classList.remove('show'), 3000);
    }

    setInterval(() => {
      const isl = document.getElementById('tournamentName');
      if(!cDat.tournamentName) return;
      tSt = (tSt + 1) % 3;
      if(tSt === 0) isl.innerText = cDat.tournamentName;
      else if(tSt === 1) isl.innerText = "CRR: " + (cDat.runRate||'0.0');
      else isl.innerText = cDat.target > 0 ? "TARGET: " + cDat.target : "SYSTEM NOMINAL";
    }, 4500);

    function rx(d) {
      cDat = d;
      inject('teamName', d.team1Name); inject('teamScore', d.team1Score); inject('teamWickets', d.team1Wickets); inject('teamOvers', d.team1Overs);
      inject('strikerName', d.strikerName); inject('strikerRuns', d.strikerRuns); inject('strikerBalls', d.strikerBalls);
      inject('nonStrikerName', d.nonStrikerName); inject('nonStrikerRuns', d.nonStrikerRuns); inject('nonStrikerBalls', d.nonStrikerBalls);
      inject('bowlerName', d.bowlerName); inject('bowlerRuns', d.bowlerRuns); inject('bowlerWickets', d.bowlerWickets); inject('bowlerOvers', d.bowlerOvers);

      let ns = parseInt(d.team1Score)||0, nw = parseInt(d.team1Wickets)||0;
      if (cSc !== -1) {
        if (nw > cWk) fireHexEvent("WICKET", "rgba(220, 38, 38, 0.9)", "#fff"); // Red
        else if (ns - cSc === 6) fireHexEvent("SIX RUNS", "rgba(33, 158, 188, 0.9)", "#fff"); // Cyan
        else if (ns - cSc === 4) fireHexEvent("FOUR", "rgba(255, 183, 3, 0.9)", "#000"); // Amber
      }
      cSc = ns; cWk = nw;
    }

    window.addEventListener('message', e => { if(e.data?.type === 'UPDATE_SCORE') rx(e.data.data); });
    if ('BroadcastChannel' in window) new BroadcastChannel('scorex_overlay_channel').onmessage = e => { if(e.data?.type === 'UPDATE_SCORE') rx(e.data.data); };
  </script>
</body>
</html>
