<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreX - Lvl 2 Airlock Split</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech&family=Oswald:wght@500;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; overflow: hidden; color: #fff; font-family: 'Share Tech', sans-serif; text-transform: uppercase; }

    @keyframes dropIn { 0% { transform: translateY(50px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

    /* Amber Top Island */
    #airlock-island {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: #0a0a0a; border: 2px solid #f59e0b;
      padding: 6px 40px; font-family: 'Oswald', sans-serif; font-size: 16px; letter-spacing: 3px; color: #f59e0b;
      clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 100%, 0 100%);
      box-shadow: 0 10px 20px rgba(0,0,0,0.8); animation: dropIn 0.8s ease-out forwards; z-index: 10;
    }

    #toss-overlay {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.95);
      display: none; align-items: center; justify-content: center; z-index: 50;
      font-family: 'Oswald', sans-serif; font-size: 40px; color: #f59e0b; letter-spacing: 2px;
    }

    /* Main Container */
    #scoreboard-wrapper {
      position: absolute; bottom: 25px; left: 0; width: 100%; height: 80px;
      display: flex; justify-content: center; align-items: stretch; gap: 8px;
      z-index: 5; animation: dropIn 1s ease-out forwards;
    }

    .a-panel { background: #0a0a0a; border: 2px solid #333; display: flex; align-items: center; padding: 0 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.8); }
    .p-score { border-bottom: 4px solid #f59e0b; min-width: 320px; justify-content: space-between; }
    .p-bowl { border-bottom: 4px solid #f59e0b; min-width: 340px; justify-content: space-between; }

    /* The Center Batsman Panel (Contains the Airlock) */
    .p-bat { flex: 1; max-width: 500px; position: relative; overflow: hidden; border-bottom: 4px solid #555; }
    
    /* The underlying Event Text */
    #airlock-event {
      position: absolute; inset: 0; background: #f59e0b; color: #000;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Oswald', sans-serif; font-size: 45px; font-weight: 700; letter-spacing: 2px;
      z-index: 1;
    }

    /* The Sliding Blast Doors */
    .door {
      position: absolute; left: 0; width: 100%; height: 50%; background: #0a0a0a; border: 1px solid #333; z-index: 2;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .door-top { top: 0; border-bottom: 2px solid #f59e0b; transform: translateY(0); }
    .door-bottom { bottom: 0; border-top: 2px solid #f59e0b; transform: translateY(0); }

    /* When active, doors split apart to reveal underlying text */
    .p-bat.active .door-top { transform: translateY(-100%); }
    .p-bat.active .door-bottom { transform: translateY(100%); }

    /* The Data Container (Sits on top of doors) */
    .bat-data { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-around; z-index: 3; padding: 0 25px; transition: opacity 0.2s; }
    .p-bat.active .bat-data { opacity: 0; }

    /* Typography */
    .tm { font-family: 'Oswald', sans-serif; font-size: 24px; color: #737373; line-height: 1; letter-spacing: 1px;}
    .sc { font-family: 'Oswald', sans-serif; font-size: 50px; color: #fff; line-height: 0.9; }
    .sc span { font-size: 28px; color: #a3a3a3; }
    .ov { font-size: 16px; font-weight: 700; color: #0a0a0a; background: #f59e0b; padding: 2px 8px; margin-left: 15px;}

    .pn { font-size: 20px; font-weight: 700; color: #fff; }
    .ps { font-family: 'Oswald', sans-serif; font-size: 40px; color: #f59e0b; margin-left: 10px; line-height: 0.9;}
    .pb { font-size: 14px; color: #737373; margin-left: 5px;}
    .lbl { font-size: 11px; color: #737373; margin-bottom: 2px; letter-spacing: 1px;}
    .v-line { width: 2px; height: 40px; background: #333; }
  </style>
</head>
<body>

  <div id="airlock-island">SCOREX-LIVE.COM</div>
  <div id="toss-overlay"></div>

  <div id="scoreboard-wrapper">
    <div class="a-panel p-score">
      <div style="display:flex; flex-direction:column;">
        <div id="teamName" class="tm">TEAM</div>
        <div style="display:flex; align-items:baseline;">
          <div class="sc"><span id="teamScore">0</span><span>/</span><span id="teamWickets">0</span></div>
          <div class="ov">OV <span id="teamOvers">0.0</span></div>
        </div>
      </div>
    </div>
    
    <div class="a-panel p-bat" id="center-airlock">
      <div id="airlock-event">DECISION PENDING</div>
      <div class="door door-top"></div>
      <div class="door door-bottom"></div>
      <div class="bat-data">
        <div style="display:flex; align-items:baseline;">
          <span style="color:#f59e0b; margin-right:8px; font-size: 14px;">▶</span>
          <span id="strikerName" class="pn">Striker</span><span id="strikerRuns" class="ps">0</span> <span class="pb">(<span id="strikerBalls">0</span>)</span>
        </div>
        <div class="v-line"></div>
        <div style="display:flex; align-items:baseline; opacity: 0.7;">
          <span id="nonStrikerName" class="pn">Non-Striker</span><span id="nonStrikerRuns" class="ps" style="color:#fff;">0</span>
        </div>
      </div>
    </div>

    <div class="a-panel p-bowl">
      <div style="display:flex; flex-direction:column;"><span class="lbl">BOWLER</span><span id="bowlerName" class="pn">Bowler Name</span></div>
      <div style="display:flex; align-items:baseline;">
        <span class="ps" style="color:#fff;"><span id="bowlerWickets">0</span>-<span id="bowlerRuns">0</span></span> <span class="pb" style="margin-left:10px;">OV <span id="bowlerOvers">0.0</span></span>
      </div>
    </div>
  </div>

  <script>
    let pSc = -1, pWk = -1, iSt = 0, cDat = {}, lockTimeout;
    const $ = id => document.getElementById(id);

    setInterval(() => {
      if(!cDat.tournamentName) return;
      iSt = (iSt + 1) % 3;
      if(iSt === 0) $('airlock-island').innerText = cDat.tournamentName;
      else if(iSt === 1) $('airlock-island').innerText = "SCOREX-LIVE.COM";
      else $('airlock-island').innerText = "CRR: " + (cDat.runRate||'0.0');
    }, 4500);

    function triggerAirlock(txt, bg, color, isPersistent) {
      const lock = $('center-airlock');
      const ev = $('airlock-event');
      if(lockTimeout) clearTimeout(lockTimeout);
      
      ev.innerText = txt; 
      ev.style.background = bg;
      ev.style.color = color;
      
      lock.classList.add('active');
      if(!isPersistent) { lockTimeout = setTimeout(() => { lock.classList.remove('active'); }, 3000); }
    }

    function processData(d) {
      cDat = d;
      if (d.team1Score == 0 && d.team1Overs === "0.0" && d.strikerRuns == 0 && d.tossWinner) {
        $('toss-overlay').style.display = 'flex'; $('toss-overlay').innerText = `${d.tossWinner} WON THE TOSS & ELECTED TO ${d.tossDecision}`;
      } else { $('toss-overlay').style.display = 'none'; }

      $('teamName').innerText = d.team1Name; $('teamScore').innerText = d.team1Score; $('teamWickets').innerText = d.team1Wickets; $('teamOvers').innerText = d.team1Overs;
      $('strikerName').innerText = d.strikerName; $('strikerRuns').innerText = d.strikerRuns; $('strikerBalls').innerText = d.strikerBalls;
      $('nonStrikerName').innerText = d.nonStrikerName; $('nonStrikerRuns').innerText = d.nonStrikerRuns;
      $('bowlerName').innerText = d.bowlerName; $('bowlerRuns').innerText = d.bowlerRuns; $('bowlerWickets').innerText = d.bowlerWickets; $('bowlerOvers').innerText = d.bowlerOvers;

      if (d.decisionPending) { triggerAirlock("DECISION PENDING", "#f59e0b", "#000", true); return; } 
      else if ($('center-airlock').classList.contains('active') && $('airlock-event').innerText === "DECISION PENDING") { $('center-airlock').classList.remove('active'); }

      let ns = parseInt(d.team1Score)||0, nw = parseInt(d.team1Wickets)||0;
      if (pSc !== -1 && !d.decisionPending) {
        if (nw > pWk) triggerAirlock("WICKET", "#dc2626", "#fff"); 
        else if (ns - pSc === 6) triggerAirlock("SIX RUNS", "#3b82f6", "#fff");
        else if (ns - pSc === 4) triggerAirlock("BOUNDARY", "#e5e5e5", "#000");
      }
      pSc = ns; pWk = nw;
    }
    window.addEventListener('message', e => { if(e.data?.type === 'UPDATE_SCORE') processData(e.data.data); });
  </script>
</body>
</html>
