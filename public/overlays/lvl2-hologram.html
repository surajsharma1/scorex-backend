<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreX - Lvl 2 Command Sphere</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; overflow: hidden; color: #fff; font-family: 'Rajdhani', sans-serif; text-transform: uppercase;}

    /* Top Corner Tournament Tag */
    #cmd-top {
      position: absolute; top: 0; right: 0;
      background: #09090b; border-bottom: 2px solid #00ffcc; border-left: 2px solid #00ffcc;
      padding: 10px 30px; font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 700;
      letter-spacing: 3px; color: #00ffcc; border-radius: 0 0 0 20px;
      box-shadow: -5px 5px 15px rgba(0, 255, 204, 0.2);
    }

    /* Expanding Ring Event Popup */
    #cmd-event {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
      font-family: 'Orbitron', sans-serif; font-size: 120px; font-weight: 900;
      color: #fff; text-shadow: 0 0 30px #00ffcc, 0 0 60px #00ffcc;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    #cmd-event.show { opacity: 1; animation: explode 2.5s ease-out forwards; }
    
    @keyframes explode {
      0% { transform: translate(-50%, -50%) scale(0.5); letter-spacing: 0px; filter: blur(10px); }
      20% { transform: translate(-50%, -50%) scale(1.2); letter-spacing: 15px; filter: blur(0px); }
      80% { transform: translate(-50%, -50%) scale(1); letter-spacing: 10px; opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
    }

    /* Edge-to-Edge Bottom Structure */
    #cmd-bottom-wrapper {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 110px;
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 25px; /* Leave space for watermark */
    }

    /* Left and Right Wings */
    .cmd-wing {
      height: 70px; flex: 1; background: rgba(9, 9, 11, 0.95);
      border-top: 2px solid rgba(255,255,255,0.1);
      display: flex; align-items: center; padding: 0 50px;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
    }
    .wing-left { justify-content: flex-end; padding-right: 120px; border-right: none;}
    .wing-right { justify-content: flex-start; padding-left: 120px; border-left: none;}

    /* The Central Sphere */
    .cmd-sphere {
      position: absolute; left: 50%; bottom: 25px; transform: translateX(-50%);
      width: 200px; height: 200px; border-radius: 50%;
      background: radial-gradient(circle at center, #18181b 0%, #000 100%);
      border: 4px solid #00ffcc;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      box-shadow: 0 0 40px rgba(0, 255, 204, 0.4), inset 0 0 30px rgba(0, 255, 204, 0.2);
      z-index: 10;
    }

    /* Spinning outer ring trick */
    .cmd-sphere::before {
      content: ''; position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px;
      border-radius: 50%; border: 2px dashed rgba(0, 255, 204, 0.5);
      animation: spin 15s linear infinite; pointer-events: none;
    }
    .cmd-sphere::after {
      content: ''; position: absolute; top: -20px; left: -20px; right: -20px; bottom: -20px;
      border-radius: 50%; border: 1px dotted rgba(255, 255, 255, 0.3);
      animation: spin 25s linear infinite reverse; pointer-events: none;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Typography inside Sphere */
    .s-tm { font-family: 'Orbitron', sans-serif; font-size: 26px; font-weight: 900; color: #fff; margin-bottom: -5px;}
    .s-sc { font-family: 'Orbitron', sans-serif; font-size: 60px; font-weight: 900; color: #00ffcc; line-height: 1; text-shadow: 0 0 15px rgba(0,255,204,0.5);}
    .s-sc span { font-size: 30px; color: #71717a; text-shadow: none;}
    .s-ov { font-size: 18px; font-weight: 700; color: #a1a1aa; letter-spacing: 2px; background: #000; padding: 2px 10px; border-radius: 10px; border: 1px solid #333;}

    /* Typography inside Wings */
    .w-grp { display: flex; align-items: baseline; gap: 15px; }
    .w-lbl { font-size: 14px; font-weight: 700; color: #71717a; letter-spacing: 1px;}
    .w-n { font-size: 26px; font-weight: 700; color: #fff;}
    .w-st { font-size: 38px; font-family: 'Orbitron', sans-serif; font-weight: 700; color: #00ffcc;}
    .w-b { font-size: 18px; font-weight: 600; color: #a1a1aa;}
    
    .w-div { width: 1px; height: 40px; background: rgba(255,255,255,0.1); margin: 0 25px;}

  </style>
</head>
<body>

  <div id="cmd-top"><span id="tournamentName">CHAMPIONSHIP SERIES</span></div>
  <div id="cmd-event"></div>

  <div id="cmd-bottom-wrapper">
    
    <div class="cmd-wing wing-left">
      <div class="w-grp" style="opacity: 0.5;">
        <span id="nonStrikerName" class="w-n">Non-Striker</span>
        <span id="nonStrikerRuns" class="w-st" style="color:#fff; font-size: 28px;">0</span>
      </div>
      <div class="w-div"></div>
      <div class="w-grp">
        <span style="color:#00ffcc; font-size:18px;">▶</span>
        <span id="strikerName" class="w-n">Striker</span>
        <span id="strikerRuns" class="w-st">0</span>
        <span class="w-b">(<span id="strikerBalls">0</span>)</span>
      </div>
    </div>

    <div class="cmd-sphere">
      <div id="teamName" class="s-tm">TEAM</div>
      <div class="s-sc"><span id="teamScore">0</span><span>/</span><span id="teamWickets">0</span></div>
      <div class="s-ov">OV <span id="teamOvers">0.0</span></div>
    </div>

    <div class="cmd-wing wing-right">
      <div class="w-grp">
        <div style="display:flex; flex-direction:column; line-height: 1.1;">
          <span class="w-lbl">CURRENT BOWLER</span>
          <span id="bowlerName" class="w-n">Bowler Name</span>
        </div>
        <div class="w-div" style="margin: 0 15px;"></div>
        <span class="w-st" style="color: #ff3366;"><span id="bowlerWickets">0</span>-<span id="bowlerRuns">0</span></span>
        <span class="w-b">OV <span id="bowlerOvers">0.0</span></span>
      </div>
    </div>

  </div>

  <div style="position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,0.4); font-family: sans-serif; letter-spacing: 1px; z-index: 10000; text-shadow: 0 1px 2px rgba(0,0,0,0.8); pointer-events: none;">
    https://scorex-live.vercel.app/
  </div>

  <script>
    let pSc = -1, pWk = -1, cDat = {};
    const inject = (id, val) => { const e = document.getElementById(id); if(e && val != null) e.innerText = val; };

    function triggerCommandEvent(txt, color) {
      const e = document.getElementById('cmd-event');
      e.innerText = txt; 
      e.style.color = '#fff';
      e.style.textShadow = `0 0 30px ${color}, 0 0 60px ${color}`;
      e.classList.remove('show');
      void e.offsetWidth; // trigger reflow to restart animation
      e.classList.add('show');
    }

    function rx(d) {
      cDat = d;
      inject('tournamentName', d.tournamentName || 'CHAMPIONSHIP SERIES');
      inject('teamName', d.team1Name); inject('teamScore', d.team1Score); inject('teamWickets', d.team1Wickets); inject('teamOvers', d.team1Overs);
      inject('strikerName', d.strikerName); inject('strikerRuns', d.strikerRuns); inject('strikerBalls', d.strikerBalls);
      inject('nonStrikerName', d.nonStrikerName); inject('nonStrikerRuns', d.nonStrikerRuns); inject('nonStrikerBalls', d.nonStrikerBalls);
      inject('bowlerName', d.bowlerName); inject('bowlerRuns', d.bowlerRuns); inject('bowlerWickets', d.bowlerWickets); inject('bowlerOvers', d.bowlerOvers);

      let ns = parseInt(d.team1Score)||0, nw = parseInt(d.team1Wickets)||0;
      if (pSc !== -1) {
        if (nw > pWk) triggerCommandEvent("WICKET DEPLOYED", "#ff3366"); // Neon Pink/Red
        else if (ns - pSc === 6) triggerCommandEvent("MAXIMUM SIX", "#00ffcc"); // Cyan
        else if (ns - pSc === 4) triggerCommandEvent("BOUNDARY SECURED", "#ffcc00"); // Yellow
      }
      pSc = ns; pWk = nw;
    }

    window.addEventListener('message', e => { if(e.data?.type === 'UPDATE_SCORE') rx(e.data.data); });
    if ('BroadcastChannel' in window) new BroadcastChannel('scorex_overlay_channel').onmessage = e => { if(e.data?.type === 'UPDATE_SCORE') rx(e.data.data); };
  </script>
</body>
</html>
