<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreX - Lvl 2 Hologram HUD</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jura:wght@500;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; overflow: hidden; color: #fff; font-family: 'Jura', sans-serif; text-transform: uppercase; }

    @keyframes dropIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes holoFlicker {
      0%, 100% { opacity: 1; }
      10%, 30%, 50% { opacity: 0.1; }
      20%, 40% { opacity: 0.8; }
    }

    /* Hologram Top Island */
    #holo-island {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 5, 20, 0.8); border: 1px solid #0ff;
      padding: 6px 30px; font-size: 15px; font-weight: 700; letter-spacing: 3px; color: #0ff;
      box-shadow: 0 0 10px #0ff, 0 0 20px #f0f; animation: dropIn 0.8s ease-out forwards; z-index: 10;
    }

    #toss-overlay {
      position: absolute; inset: 0; background: rgba(0, 5, 20, 0.95);
      display: none; align-items: center; justify-content: center; z-index: 50;
      font-size: 40px; font-weight: 900; color: #f0f; text-shadow: -2px 0 #0ff, 2px 0 #f0f;
    }

    /* Scoreboard Container */
    #scoreboard-wrapper {
      position: absolute; bottom: 30px; left: 0; width: 100%; height: 80px;
      display: flex; justify-content: center; gap: 15px; z-index: 5;
      animation: dropIn 1s ease-out forwards;
      transition: opacity 0.3s;
    }
    #scoreboard-wrapper.glitch-out { opacity: 0.05; pointer-events: none; }

    .h-panel { 
      background: rgba(10, 0, 20, 0.85); border-top: 1px solid #0ff; border-bottom: 1px solid #f0f;
      display: flex; align-items: center; padding: 0 30px; 
      box-shadow: 0 10px 20px rgba(0, 255, 255, 0.1), inset 0 0 10px rgba(255, 0, 255, 0.2);
    }
    .p-score { min-width: 320px; justify-content: space-between; border-left: 3px solid #0ff; }
    .p-bat { flex: 1; max-width: 500px; justify-content: space-around; }
    .p-bowl { min-width: 340px; justify-content: space-between; border-right: 3px solid #f0f; }

    /* Floating Hologram Projection */
    #holo-event {
      position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%) scale(1.5);
      font-size: 80px; font-weight: 900; color: #fff;
      text-shadow: -3px 0 #0ff, 3px 0 #f0f, 0 0 20px #fff;
      z-index: 1; opacity: 0; pointer-events: none;
    }
    #holo-event.active { opacity: 1; animation: holoFlicker 0.4s ease-in; }

    .tm { font-size: 20px; font-weight: 900; color: #f0f; line-height: 1; text-shadow: 0 0 5px #f0f;}
    .sc { font-size: 50px; font-weight: 900; line-height: 1; color: #fff;}
    .sc span { font-size: 26px; color: #0ff; }
    .ov { font-size: 15px; font-weight: 700; color: #fff; background: rgba(0,255,255,0.3); padding: 2px 10px; margin-left: 15px; border: 1px solid #0ff;}

    .pn { font-size: 20px; font-weight: 700; color: #fff; }
    .ps { font-size: 40px; font-weight: 900; color: #0ff; margin-left: 10px; line-height: 1; text-shadow: 0 0 5px #0ff;}
    .pb { font-size: 14px; color: #a855f7; font-weight: 700; margin-left: 5px;}
    .lbl { font-size: 12px; color: #f0f; font-weight: 900; margin-bottom: 2px;}
    .v-line { width: 1px; height: 35px; background: rgba(255, 0, 255, 0.5); }
  </style>
</head>
<body>

  <div id="holo-island">SCOREX-LIVE.COM</div>
  <div id="toss-overlay"></div>
  <div id="holo-event">DECISION PENDING</div>

  <div id="scoreboard-wrapper">
    <div class="h-panel p-score">
      <div style="display:flex; flex-direction:column;">
        <div id="teamName" class="tm">TEAM</div>
        <div style="display:flex; align-items:baseline;">
          <div class="sc"><span id="teamScore">0</span><span>/</span><span id="teamWickets">0</span></div>
          <div class="ov">OV <span id="teamOvers">0.0</span></div>
        </div>
      </div>
    </div>
    
    <div class="h-panel p-bat">
      <div style="display:flex; align-items:baseline;">
        <span style="color:#0ff; margin-right:8px; font-size: 16px;">▶</span>
        <span id="strikerName" class="pn">Striker</span><span id="strikerRuns" class="ps">0</span> <span class="pb">(<span id="strikerBalls">0</span>)</span>
      </div>
      <div class="v-line"></div>
      <div style="display:flex; align-items:baseline; opacity: 0.6;">
        <span id="nonStrikerName" class="pn">Non-Striker</span><span id="nonStrikerRuns" class="ps" style="color:#fff;">0</span>
      </div>
    </div>

    <div class="h-panel p-bowl">
      <div style="display:flex; flex-direction:column;"><span class="lbl">BOWLER</span><span id="bowlerName" class="pn">Bowler Name</span></div>
      <div style="display:flex; align-items:baseline;">
        <span class="ps" style="color:#fff;"><span id="bowlerWickets">0</span>-<span id="bowlerRuns">0</span></span> <span class="pb" style="margin-left:10px;">OV <span id="bowlerOvers">0.0</span></span>
      </div>
    </div>
  </div>

  <script>
    let pSc = -1, pWk = -1, iSt = 0, cDat = {}, holoTimeout;
    const $ = id => document.getElementById(id);

    setInterval(() => {
      if(!cDat.tournamentName) return;
      iSt = (iSt + 1) % 3;
      if(iSt === 0) $('holo-island').innerText = cDat.tournamentName;
      else if(iSt === 1) $('holo-island').innerText = "SCOREX-LIVE.COM";
      else $('holo-island').innerText = "CRR: " + (cDat.runRate||'0.0');
    }, 4500);

    function triggerHologram(txt, isPersistent) {
      const wrap = $('scoreboard-wrapper');
      const ev = $('holo-event');
      if(holoTimeout) clearTimeout(holoTimeout);
      
      ev.innerText = txt; 
      
      // Dynamic Hologram colors based on event
      if(txt === "WICKET") ev.style.textShadow = "-3px 0 #f00, 3px 0 #fff, 0 0 20px #f00";
      else if(txt === "DECISION PENDING") ev.style.textShadow = "-3px 0 #ff0, 3px 0 #f00, 0 0 20px #ff0";
      else ev.style.textShadow = "-3px 0 #0ff, 3px 0 #f0f, 0 0 20px #fff";

      wrap.classList.add('glitch-out');
      ev.classList.add('active');

      if(!isPersistent) { 
        holoTimeout = setTimeout(() => { 
          wrap.classList.remove('glitch-out');
          ev.classList.remove('active');
        }, 3000); 
      }
    }

    function processData(d) {
      cDat = d;
      if (d.team1Score == 0 && d.team1Overs === "0.0" && d.strikerRuns == 0 && d.tossWinner) {
        $('toss-overlay').style.display = 'flex'; $('toss-overlay').innerText = `${d.tossWinner} WON THE TOSS & ELECTED TO ${d.tossDecision}`;
      } else { $('toss-overlay').style.display = 'none'; }

      $('teamName').innerText = d.team1Name; $('teamScore').innerText = d.team1Score; $('teamWickets').innerText = d.team1Wickets; $('teamOvers').innerText = d.team1Overs;
      $('strikerName').innerText = d.strikerName; $('strikerRuns').innerText = d.strikerRuns; $('strikerBalls').innerText = d.strikerBalls;
      $('nonStrikerName').innerText = d.nonStrikerName; $('nonStrikerRuns').innerText = d.nonStrikerRuns;
      $('bowlerName').innerText = d.bowlerName; $('bowlerRuns').innerText = d.bowlerRuns; $('bowlerWickets').innerText = d.bowlerWickets; $('bowlerOvers').innerText = d.bowlerOvers;

      if (d.decisionPending) { triggerHologram("DECISION PENDING", true); return; } 
      else if ($('holo-event').classList.contains('active') && $('holo-event').innerText === "DECISION PENDING") { 
        $('scoreboard-wrapper').classList.remove('glitch-out');
        $('holo-event').classList.remove('active'); 
      }

      let ns = parseInt(d.team1Score)||0, nw = parseInt(d.team1Wickets)||0;
      if (pSc !== -1 && !d.decisionPending) {
        if (nw > pWk) triggerHologram("WICKET"); 
        else if (ns - pSc === 6) triggerHologram("MAXIMUM SIX");
        else if (ns - pSc === 4) triggerHologram("BOUNDARY");
      }
      pSc = ns; pWk = nw;
    }
    window.addEventListener('message', e => { if(e.data?.type === 'UPDATE_SCORE') processData(e.data.data); });
  </script>
</body>
</html>
