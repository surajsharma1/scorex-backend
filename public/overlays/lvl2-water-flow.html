<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreX - Lvl 2 Liquid Elastic</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; overflow: hidden; color: #fff; font-family: 'Nunito', sans-serif; text-transform: uppercase; }

    @keyframes dropIn { 0% { transform: translateY(50px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

    /* Pill Island */
    #liquid-island {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: #0f172a; border: 2px solid #06b6d4;
      padding: 8px 30px; border-radius: 40px; font-size: 14px; font-weight: 800; letter-spacing: 2px; color: #06b6d4;
      box-shadow: 0 5px 15px rgba(6, 182, 212, 0.3); animation: dropIn 0.8s ease-out forwards; z-index: 10;
    }

    #toss-overlay {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.95);
      display: none; align-items: center; justify-content: center; z-index: 50;
      font-size: 35px; font-weight: 900; color: #06b6d4;
    }

    /* Scoreboard Container */
    #scoreboard-wrapper {
      position: absolute; bottom: 35px; left: 0; width: 100%; height: 80px;
      display: flex; justify-content: center; gap: 10px; z-index: 5;
      animation: dropIn 1s ease-out forwards;
    }

    .l-panel { background: #0f172a; border-radius: 40px; display: flex; align-items: center; padding: 0 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.6); position: relative;}
    .p-score { min-width: 330px; justify-content: space-between; border: 2px solid #06b6d4; }
    .p-bat { flex: 1; max-width: 500px; justify-content: space-around; }
    .p-bowl { min-width: 340px; justify-content: space-between; }

    /* Elastic Drop Tab (Anchored to the bottom of the Center Panel) */
    #drop-tab {
      position: absolute; top: 50%; left: 50%; transform: translateX(-50%);
      width: 80%; background: #06b6d4; color: #0f172a;
      border-radius: 0 0 25px 25px; padding-top: 40px; padding-bottom: 10px;
      display: flex; align-items: flex-end; justify-content: center;
      font-size: 32px; font-weight: 900;
      clip-path: inset(0 0 100% 0); /* Hides it */
      transition: clip-path 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: -1;
    }
    #drop-tab.show { clip-path: inset(0 0 -100px 0); }

    .tm { font-size: 18px; font-weight: 900; color: #94a3b8; line-height: 1;}
    .sc { font-size: 46px; font-weight: 900; line-height: 1; color: #fff;}
    .sc span { font-size: 26px; color: #64748b; }
    .ov { font-size: 15px; font-weight: 900; color: #0f172a; background: #06b6d4; padding: 2px 10px; border-radius: 15px; margin-left: 15px;}

    .pn { font-size: 20px; font-weight: 800; color: #fff; }
    .ps { font-size: 38px; font-weight: 900; color: #06b6d4; margin-left: 10px; line-height: 1;}
    .pb { font-size: 14px; color: #64748b; font-weight: 800; margin-left: 5px;}
    .lbl { font-size: 12px; color: #06b6d4; font-weight: 900; margin-bottom: 2px;}
    .v-line { width: 2px; height: 35px; background: #334155; }
  </style>
</head>
<body>

  <div id="liquid-island">SCOREX-LIVE.COM</div>
  <div id="toss-overlay"></div>

  <div id="scoreboard-wrapper">
    <div class="l-panel p-score">
      <div style="display:flex; flex-direction:column;">
        <div id="teamName" class="tm">TEAM</div>
        <div style="display:flex; align-items:baseline;">
          <div class="sc"><span id="teamScore">0</span><span>/</span><span id="teamWickets">0</span></div>
          <div class="ov">OV <span id="teamOvers">0.0</span></div>
        </div>
      </div>
    </div>
    
    <div class="l-panel p-bat">
      <div id="drop-tab">DECISION PENDING</div>

      <div style="display:flex; align-items:baseline;">
        <span style="color:#06b6d4; margin-right:8px; font-size: 16px;">●</span>
        <span id="strikerName" class="pn">Striker</span><span id="strikerRuns" class="ps">0</span> <span class="pb">(<span id="strikerBalls">0</span>)</span>
      </div>
      <div class="v-line"></div>
      <div style="display:flex; align-items:baseline; opacity: 0.6;">
        <span id="nonStrikerName" class="pn">Non-Striker</span><span id="nonStrikerRuns" class="ps" style="color:#fff;">0</span>
      </div>
    </div>

    <div class="l-panel p-bowl">
      <div style="display:flex; flex-direction:column;"><span class="lbl">BOWLER</span><span id="bowlerName" class="pn">Bowler Name</span></div>
      <div style="display:flex; align-items:baseline;">
        <span class="ps" style="color:#fff;"><span id="bowlerWickets">0</span>-<span id="bowlerRuns">0</span></span> <span class="pb" style="margin-left:10px;">OV <span id="bowlerOvers">0.0</span></span>
      </div>
    </div>
  </div>

  <script>
    let pSc = -1, pWk = -1, iSt = 0, cDat = {}, dropTimeout;
    const $ = id => document.getElementById(id);

    setInterval(() => {
      if(!cDat.tournamentName) return;
      iSt = (iSt + 1) % 3;
      if(iSt === 0) $('liquid-island').innerText = cDat.tournamentName;
      else if(iSt === 1) $('liquid-island').innerText = "SCOREX-LIVE.COM";
      else $('liquid-island').innerText = "CRR: " + (cDat.runRate||'0.0');
    }, 4500);

    function triggerDrop(txt, bg, color, isPersistent) {
      const drop = $('drop-tab');
      if(dropTimeout) clearTimeout(dropTimeout);
      
      drop.innerText = txt; 
      drop.style.background = bg;
      drop.style.color = color;
      
      drop.classList.add('show');
      if(!isPersistent) { dropTimeout = setTimeout(() => { drop.classList.remove('show'); }, 3000); }
    }

    function processData(d) {
      cDat = d;
      if (d.team1Score == 0 && d.team1Overs === "0.0" && d.strikerRuns == 0 && d.tossWinner) {
        $('toss-overlay').style.display = 'flex'; $('toss-overlay').innerText = `${d.tossWinner} WON THE TOSS & ELECTED TO ${d.tossDecision}`;
      } else { $('toss-overlay').style.display = 'none'; }

      $('teamName').innerText = d.team1Name; $('teamScore').innerText = d.team1Score; $('teamWickets').innerText = d.team1Wickets; $('teamOvers').innerText = d.team1Overs;
      $('strikerName').innerText = d.strikerName; $('strikerRuns').innerText = d.strikerRuns; $('strikerBalls').innerText = d.strikerBalls;
      $('nonStrikerName').innerText = d.nonStrikerName; $('nonStrikerRuns').innerText = d.nonStrikerRuns;
      $('bowlerName').innerText = d.bowlerName; $('bowlerRuns').innerText = d.bowlerRuns; $('bowlerWickets').innerText = d.bowlerWickets; $('bowlerOvers').innerText = d.bowlerOvers;

      if (d.decisionPending) { triggerDrop("DECISION PENDING", "#fbbf24", "#0f172a", true); return; } 
      else if ($('drop-tab').classList.contains('show') && $('drop-tab').innerText === "DECISION PENDING") { $('drop-tab').classList.remove('show'); }

      let ns = parseInt(d.team1Score)||0, nw = parseInt(d.team1Wickets)||0;
      if (pSc !== -1 && !d.decisionPending) {
        if (nw > pWk) triggerDrop("WICKET", "#ef4444", "#fff"); 
        else if (ns - pSc === 6) triggerDrop("SIX RUNS", "#06b6d4", "#0f172a");
        else if (ns - pSc === 4) triggerDrop("BOUNDARY", "#f1f5f9", "#0f172a");
      }
      pSc = ns; pWk = nw;
    }
    window.addEventListener('message', e => { if(e.data?.type === 'UPDATE_SCORE') processData(e.data.data); });
  </script>
</body>
</html>
