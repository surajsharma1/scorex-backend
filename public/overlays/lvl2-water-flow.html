<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreX - Lvl 2 Holographic Visor</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700;900&family=Jura:wght@600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; overflow: hidden; color: #fff; font-family: 'Exo 2', sans-serif; }

    /* Top Island - Curved Downward */
    #visor-top {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      background: rgba(0, 15, 30, 0.9);
      border-bottom: 2px solid #00f0ff;
      border-radius: 0 0 50px 50px;
      padding: 10px 40px 15px 40px;
      font-family: 'Jura', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 4px;
      color: #00f0ff; text-transform: uppercase;
      box-shadow: 0 10px 30px rgba(0, 240, 255, 0.3);
    }

    /* Laser Scan Event Popup */
    #visor-event {
      position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
      font-size: 130px; font-weight: 900; text-transform: uppercase; color: transparent;
      -webkit-text-stroke: 2px #ff007f;
      opacity: 0; pointer-events: none;
    }
    #visor-event.show {
      animation: laserScan 2.5s ease-in-out forwards;
    }

    @keyframes laserScan {
      0% { opacity: 0; clip-path: inset(0 100% 0 0); filter: drop-shadow(0 0 0 #ff007f); }
      20% { opacity: 1; clip-path: inset(0 0 0 0); filter: drop-shadow(0 0 20px #ff007f); color: rgba(255,0,127,0.2); }
      80% { opacity: 1; clip-path: inset(0 0 0 0); filter: drop-shadow(0 0 40px #ff007f); color: #ff007f; }
      100% { opacity: 0; transform: translate(-50%, -60%) scale(1.1); }
    }

    /* The Massive Visor Curve (Bottom) */
    #visor-bottom-wrapper {
      position: absolute; bottom: -60px; left: -10%; width: 120%; height: 220px;
      background: radial-gradient(ellipse at top, rgba(0, 30, 60, 0.95) 0%, rgba(0, 5, 10, 0.98) 100%);
      border-top: 3px solid #00f0ff;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      box-shadow: 0 -15px 50px rgba(0, 240, 255, 0.2), inset 0 10px 30px rgba(0, 240, 255, 0.1);
      display: flex; justify-content: center; padding-top: 25px;
    }

    /* Content Area inside the curve */
    .visor-content {
      width: 80%; max-width: 1400px; display: flex; justify-content: space-between; align-items: flex-start;
      margin-top: 10px;
    }

    .v-block { display: flex; flex-direction: column; align-items: center; text-align: center; }

    /* Typography */
    .v-score-block { transform: translateY(-15px); } /* Push center block up slightly */
    .tm-lbl { font-family: 'Jura', sans-serif; font-size: 28px; font-weight: 700; color: #00f0ff; letter-spacing: 2px; }
    .sc-lbl { font-size: 65px; font-weight: 900; line-height: 0.9; text-shadow: 0 0 20px rgba(0,240,255,0.4); }
    .sc-lbl span { font-size: 35px; color: #888; text-shadow: none; }
    .ov-lbl { font-size: 18px; font-weight: 700; color: #aaa; background: rgba(255,255,255,0.1); padding: 4px 15px; border-radius: 20px; margin-top: 5px;}

    .v-bats-block, .v-bowl-block { width: 350px; }
    .side-lbl { font-family: 'Jura', sans-serif; font-size: 14px; color: #ff007f; letter-spacing: 2px; margin-bottom: 5px; text-transform: uppercase;}
    
    .p-row { display: flex; justify-content: space-between; align-items: baseline; width: 100%; border-bottom: 1px solid rgba(0,240,255,0.2); padding-bottom: 5px; margin-bottom: 5px;}
    .p-row:last-child { border-bottom: none; }
    .p-n { font-size: 22px; font-weight: 700; }
    .p-s { font-size: 32px; font-weight: 900; color: #00f0ff; }
    .p-b { font-size: 16px; color: #888; }
    
    .striker { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
    .non-striker { opacity: 0.6; }

  </style>
</head>
<body>

  <div id="visor-top"><span id="tournamentName">HOLO-LINK ACTIVE</span></div>
  <div id="visor-event"></div>

  <div id="visor-bottom-wrapper">
    <div class="visor-content">
      
      <div class="v-block v-bats-block">
        <div class="side-lbl">BATTING METRICS</div>
        <div class="p-row striker">
          <div style="display:flex; align-items:center; gap:8px;">
            <div style="width:8px; height:8px; background:#ff007f; border-radius:50%; box-shadow:0 0 10px #ff007f;"></div>
            <span id="strikerName" class="p-n">Striker</span>
          </div>
          <div><span id="strikerRuns" class="p-s">0</span> <span class="p-b">(<span id="strikerBalls">0</span>)</span></div>
        </div>
        <div class="p-row non-striker">
          <span id="nonStrikerName" class="p-n" style="margin-left: 16px;">Non-Striker</span>
          <div><span id="nonStrikerRuns" class="p-s" style="color:#aaa; font-size:26px;">0</span> <span class="p-b">(<span id="nonStrikerBalls">0</span>)</span></div>
        </div>
      </div>

      <div class="v-block v-score-block">
        <div id="teamName" class="tm-lbl">TEAM</div>
        <div class="sc-lbl"><span id="teamScore">0</span><span>/</span><span id="teamWickets">0</span></div>
        <div class="ov-lbl">OVERS <span id="teamOvers">0.0</span></div>
      </div>

      <div class="v-block v-bowl-block">
        <div class="side-lbl">BOWLING METRICS</div>
        <div class="p-row">
          <span id="bowlerName" class="p-n">Bowler Name</span>
          <span class="p-s" style="color: #ff007f;"><span id="bowlerWickets">0</span>-<span id="bowlerRuns">0</span></span>
        </div>
        <div style="align-self: flex-end; font-size: 18px; color: #888; font-weight: 700; margin-top: 5px;">
          OVERS <span id="bowlerOvers" style="color:#fff;">0.0</span>
        </div>
      </div>

    </div>
  </div>

  <div style="position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); font-size: 11px; color: rgba(255,255,255,0.3); font-family: sans-serif; letter-spacing: 2px; z-index: 10000; pointer-events: none;">
    https://scorex-live.vercel.app/
  </div>

  <script>
    let cSc = -1, cWk = -1, cDat = {};
    const inject = (id, val) => { const e = document.getElementById(id); if(e && val != null) e.innerText = val; };

    function fireVisorEvent(txt) {
      const e = document.getElementById('visor-event');
      e.innerText = txt;
      e.classList.remove('show');
      void e.offsetWidth; 
      e.classList.add('show');
    }

    setInterval(() => {
      const isl = document.getElementById('tournamentName');
      if(!cDat.tournamentName) return;
      let st = Math.floor(Date.now() / 4500) % 3;
      if(st === 0) isl.innerText = cDat.tournamentName;
      else if(st === 1) isl.innerText = "CRR // " + (cDat.runRate||'0.0');
      else isl.innerText = cDat.target > 0 ? "TARGET // " + cDat.target : "SYSTEM NOMINAL";
    }, 4500);

    function rx(d) {
      cDat = d;
      inject('teamName', d.team1Name); inject('teamScore', d.team1Score); inject('teamWickets', d.team1Wickets); inject('teamOvers', d.team1Overs);
      inject('strikerName', d.strikerName); inject('strikerRuns', d.strikerRuns); inject('strikerBalls', d.strikerBalls);
      inject('nonStrikerName', d.nonStrikerName); inject('nonStrikerRuns', d.nonStrikerRuns); inject('nonStrikerBalls', d.nonStrikerBalls);
      inject('bowlerName', d.bowlerName); inject('bowlerRuns', d.bowlerRuns); inject('bowlerWickets', d.bowlerWickets); inject('bowlerOvers', d.bowlerOvers);

      let ns = parseInt(d.team1Score)||0, nw = parseInt(d.team1Wickets)||0;
      if (cSc !== -1) {
        if (nw > cWk) fireVisorEvent("WICKET");
        else if (ns - cSc === 6) fireVisorEvent("SIX RUNS");
        else if (ns - cSc === 4) fireVisorEvent("FOUR RUNS");
      }
      cSc = ns; cWk = nw;
    }

    window.addEventListener('message', e => { if(e.data?.type === 'UPDATE_SCORE') rx(e.data.data); });
    if ('BroadcastChannel' in window) new BroadcastChannel('scorex_overlay_channel').onmessage = e => { if(e.data?.type === 'UPDATE_SCORE') rx(e.data.data); };
  </script>
</body>
</html>
