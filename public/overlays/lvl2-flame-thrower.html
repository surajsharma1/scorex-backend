<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScoreX - Lvl 2 Tech Capsule Flip</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@500;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: transparent; overflow: hidden; color: #fff; font-family: 'Rajdhani', sans-serif; text-transform: uppercase; }

    @keyframes dropIn {
      0% { transform: translateY(50px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    
    @keyframes shine {
      0% { transform: translateX(-150%) skewX(-25deg); }
      20%, 100% { transform: translateX(250%) skewX(-25deg); }
    }

    /* Floating Capsule Island */
    #flip-island {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(to bottom, #1e293b, #020617);
      border: 1px solid #00f5ff;
      border-radius: 30px;
      padding: 6px 40px; font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 700;
      color: #00f5ff; letter-spacing: 3px; 
      box-shadow: 0 10px 20px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.2);
      animation: dropIn 0.8s ease-out forwards;
      position: relative; overflow: hidden;
    }
    #flip-island::after {
      content: ''; position: absolute; top: 0; left: 0; width: 50%; height: 100%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
      animation: shine 5s infinite; pointer-events: none;
    }

    #toss-plate {
      position: absolute; inset: 0; background: rgba(2, 6, 23, 0.95);
      display: none; align-items: center; justify-content: center; z-index: 50;
      font-family: 'Orbitron', sans-serif; font-size: 30px; font-weight: 900; color: #00f5ff;
      text-shadow: 0 0 15px rgba(0, 245, 255, 0.5);
    }

    /* THE CAPSULE BOTTOM WRAPPER */
    #flip-bottom {
      position: absolute; bottom: 25px; left: 0; width: 100%; 
      height: 80px; /* RIGID HEIGHT FOR 3D FLIP */
      display: flex; gap: 12px; padding: 0 40px;
      animation: dropIn 1s ease-out forwards;
    }

    /* FLIP CONTAINER - Score Block */
    .flip-container {
      position: relative; width: 360px; height: 100%; perspective: 1200px;
    }
    .flipper {
      width: 100%; height: 100%; position: absolute; top: 0; left: 0;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
    }
    .flipper.flip { transform: rotateX(180deg); }
    
    /* COMMON METALLIC STYLE FOR ALL BLOCKS */
    .front, .back, .m-panel {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; backface-visibility: hidden;
      background: linear-gradient(135deg, #2b3240 0%, #0f172a 100%); 
      border: 1px solid #334155; border-bottom: 3px solid #000;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 2px 0px rgba(255,255,255,0.15);
      display: flex; justify-content: space-between; align-items: center; padding: 0 25px;
      overflow: hidden;
    }
    
    /* THE SHINE EFFECT */
    .front::after, .back::after, .m-panel::after {
      content: ''; position: absolute; top: 0; left: 0; width: 50%; height: 100%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
      animation: shine 4s infinite; pointer-events: none; z-index: 1;
    }
    
    /* SHAPE DISTINCTIONS (Pill Ends vs Block Center) */
    .front { border-radius: 40px 10px 10px 40px; border-left: 4px solid #00f5ff; }
    .back {
      transform: rotateX(180deg); 
      background: linear-gradient(to bottom, #00f5ff, #008288); border-left: 4px solid #fff;
      border-radius: 40px 10px 10px 40px;
      justify-content: center; color: #000; font-family: 'Orbitron', sans-serif; font-size: 35px; font-weight: 900;
    }
    
    .m-panel { position: relative; height: 100%; }
    .p-bat { flex: 1; justify-content: space-around; border-radius: 10px; }
    .p-bowl { min-width: 320px; justify-content: space-between; border-radius: 10px 40px 40px 10px; border-right: 4px solid #00f5ff; }

    .txt-layer { position: relative; z-index: 2; width: 100%; display: flex; align-items: center; justify-content: space-between;}

    /* Typography */
    .tm { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700; color: #94a3b8; letter-spacing: 1px;}
    .sc { font-size: 50px; font-weight: 700; color: #fff; line-height: 0.8; }
    .sc span { font-size: 28px; color: #94a3b8; }
    .ov { font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 700; color: #00f5ff; background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 10px; margin-left: 15px;}

    .pn { font-size: 22px; font-weight: 700; color: #e2e8f0; }
    .ps { font-size: 40px; font-weight: 700; color: #00f5ff; margin-left: 10px; line-height: 0.8;}
    .pb { font-size: 16px; color: #94a3b8; font-weight: 600;}
    .lbl { font-size: 11px; color: #00f5ff; font-weight: 700; margin-bottom: 2px; letter-spacing: 1px;}
    
    .v-line { width: 1px; height: 40px; background: rgba(255,255,255,0.15); }
  </style>
</head>
<body>

  <div id="flip-island"><span id="island-text">SCOREX-LIVE.COM</span></div>
  <div id="toss-plate"></div>

  <div id="flip-bottom">
    
    <div class="flip-container">
      <div class="flipper" id="score-flipper">
        <div class="front">
          <div class="txt-layer" style="flex-direction: column; align-items: flex-start;">
            <div id="teamName" class="tm">TEAM</div>
            <div style="display:flex; align-items:baseline; margin-top: 5px;">
              <div class="sc"><span id="teamScore">0</span><span>/</span><span id="teamWickets">0</span></div>
              <div class="ov">OV <span id="teamOvers">0.0</span></div>
            </div>
          </div>
        </div>
        <div class="back"><span class="txt-layer" id="flip-event-text" style="justify-content:center;">DECISION PENDING</span></div>
      </div>
    </div>

    <div class="m-panel p-bat">
      <div class="txt-layer" style="justify-content: space-around;">
        <div style="display:flex; align-items:baseline;">
          <span style="color:#00f5ff; margin-right:8px; font-size:12px;">▶</span>
          <span id="strikerName" class="pn">Striker</span><span id="strikerRuns" class="ps">0</span> <span class="pb" style="margin-left: 8px;">(<span id="strikerBalls">0</span>)</span>
        </div>
        <div class="v-line"></div>
        <div style="display:flex; align-items:baseline; opacity: 0.6;">
          <span id="nonStrikerName" class="pn">Non-Striker</span><span id="nonStrikerRuns" class="ps" style="color:#fff;">0</span>
        </div>
      </div>
    </div>

    <div class="m-panel p-bowl">
      <div class="txt-layer">
        <div style="display:flex; flex-direction:column;"><span class="lbl">BOWLER</span><span id="bowlerName" class="pn">Bowler Name</span></div>
        <div style="display:flex; align-items:baseline;">
          <span class="ps" style="color:#fff;"><span id="bowlerWickets">0</span>-<span id="bowlerRuns">0</span></span> <span class="pb" style="margin-left:10px;">OV <span id="bowlerOvers">0.0</span></span>
        </div>
      </div>
    </div>

  </div>

  <script>
    let pSc = -1, pWk = -1, iSt = 0, cDat = {}, flipTimeout;
    const $ = id => document.getElementById(id);

    setInterval(() => {
      if(!cDat.tournamentName) return;
      iSt = (iSt + 1) % 3;
      if(iSt === 0) $('island-text').innerText = cDat.tournamentName;
      else if(iSt === 1) $('island-text').innerText = "SCOREX-LIVE.COM";
      else $('island-text').innerText = "CRR: " + (cDat.runRate||'0.0');
    }, 4500);

    function triggerFlip(txt, isPersistent) {
      const flipper = $('score-flipper');
      const back = document.querySelector('.back');
      const text = $('flip-event-text');
      
      if(flipTimeout) clearTimeout(flipTimeout);
      text.innerText = txt; 
      
      // Dynamic back face colors
      if(txt === "WICKET!") {
        back.style.background = "linear-gradient(to bottom, #ef4444, #7f1d1d)";
        back.style.color = "#fff";
      }
      else if(txt === "DECISION PENDING") {
        back.style.background = "linear-gradient(to bottom, #fbbf24, #b45309)";
        back.style.color = "#000";
      }
      else {
        back.style.background = "linear-gradient(to bottom, #00f5ff, #008288)";
        back.style.color = "#000";
      }
      
      flipper.classList.add('flip');
      if (!isPersistent) { flipTimeout = setTimeout(() => { flipper.classList.remove('flip'); }, 3500); }
    }

    function processData(d) {
      cDat = d;
      if (d.team1Score == 0 && d.team1Overs === "0.0" && d.strikerRuns == 0 && d.tossWinner) {
        $('toss-plate').style.display = 'flex'; $('toss-plate').innerText = `${d.tossWinner} WON THE TOSS & CHOSE TO ${d.tossDecision}`;
      } else { $('toss-plate').style.display = 'none'; }

      $('teamName').innerText = d.team1Name; $('teamScore').innerText = d.team1Score; $('teamWickets').innerText = d.team1Wickets; $('teamOvers').innerText = d.team1Overs;
      $('strikerName').innerText = d.strikerName; $('strikerRuns').innerText = d.strikerRuns; $('strikerBalls').innerText = d.strikerBalls;
      $('nonStrikerName').innerText = d.nonStrikerName; $('nonStrikerRuns').innerText = d.nonStrikerRuns;
      $('bowlerName').innerText = d.bowlerName; $('bowlerRuns').innerText = d.bowlerRuns; $('bowlerWickets').innerText = d.bowlerWickets; $('bowlerOvers').innerText = d.bowlerOvers;

      if (d.decisionPending) { triggerFlip("DECISION PENDING", true); return; } 
      else if ($('score-flipper').classList.contains('flip') && $('flip-event-text').innerText === "DECISION PENDING") { $('score-flipper').classList.remove('flip'); }

      let ns = parseInt(d.team1Score)||0, nw = parseInt(d.team1Wickets)||0;
      if (pSc !== -1 && !d.decisionPending) {
        if (nw > pWk) triggerFlip("WICKET!"); 
        else if (ns - pSc === 6) triggerFlip("MAXIMUM!"); 
        else if (ns - pSc === 4) triggerFlip("BOUNDARY!"); 
      }
      pSc = ns; pWk = nw;
    }
    window.addEventListener('message', e => { if(e.data?.type === 'UPDATE_SCORE') processData(e.data.data); });
  </script>
</body>
</html>
